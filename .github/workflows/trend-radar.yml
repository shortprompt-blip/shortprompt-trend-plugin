              ) as handle:

                  json.load(
                      handle
                  )


              print(
                  f"Valid JSON: {file}"
              )


          history_files = list(

              Path(
                  "data/history"
              ).glob(
                  "*.json"
              )

          )


          print(
              f"History files: "
              f"{len(history_files)}"
          )


          for file in history_files:

              with file.open(
                  "r",
                  encoding="utf-8"
              ) as handle:

                  json.load(
                      handle
                  )


              print(
                  f"Valid JSON: {file}"
              )


          print("")
          print(
              "All Trend Radar V2 JSON files "
              "are valid."
          )

