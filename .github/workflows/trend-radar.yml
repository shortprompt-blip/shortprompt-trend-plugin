name: ShortPrompt Trend Radar V2.1

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-trends:
    name: Collect and Analyze Google Trends V2.1
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify environment
        run: |
          node --version
          npm --version
          python3 --version

      - name: Collect and analyze Google Trends V2.1
        env:
          TZ: Europe/Rome
        run: |
          python3 <<'PY'

          import json
          import math
          import re
          import unicodedata
          import urllib.request
          import xml.etree.ElementTree as ET

          from datetime import datetime, timedelta, timezone
          from pathlib import Path


          # ============================================================
          # SHORTPROMPT TREND RADAR V2.1
          #
          # BASE:
          #   ShortPrompt Trend Radar V2
          #
          # V2.1 ADDITIONS:
          #   - stronger title normalization
          #   - compatibility with old V2 history/state
          #   - momentum metrics
          #   - IT + US + GB + DE + FR + ES
          #   - Global Score
          #   - Italy Score
          #   - Crossover Score
          #   - Opportunity Score
          #
          # IMPORTANT:
          #   Existing Italy V2 data is preserved.
          #   Global data uses separate history/state files.
          # ============================================================


          # ============================================================
          # CONFIGURATION
          # ============================================================

          MARKETS = {
              "IT": {
                  "name": "Italy",
                  "flag": "🇮🇹",
                  "url": "https://trends.google.com/trending/rss?geo=IT"
              },
              "US": {
                  "name": "United States",
                  "flag": "🇺🇸",
                  "url": "https://trends.google.com/trending/rss?geo=US"
              },
              "GB": {
                  "name": "United Kingdom",
                  "flag": "🇬🇧",
                  "url": "https://trends.google.com/trending/rss?geo=GB"
              },
              "DE": {
                  "name": "Germany",
                  "flag": "🇩🇪",
                  "url": "https://trends.google.com/trending/rss?geo=DE"
              },
              "FR": {
                  "name": "France",
                  "flag": "🇫🇷",
                  "url": "https://trends.google.com/trending/rss?geo=FR"
              },
              "ES": {
                  "name": "Spain",
                  "flag": "🇪🇸",
                  "url": "https://trends.google.com/trending/rss?geo=ES"
              }
          }


          DATA_DIR = Path("data")
          HISTORY_DIR = DATA_DIR / "history"

          LATEST_FILE = DATA_DIR / "latest.json"

          STATE_FILE = DATA_DIR / "trends-state.json"

          GLOBAL_STATE_FILE = DATA_DIR / "global-state.json"

          HISTORY_HOURS = 72
          STATE_RETENTION_DAYS = 14

          DATA_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          HISTORY_DIR.mkdir(
              parents=True,
              exist_ok=True
          )


          # ============================================================
          # TIME
          # ============================================================

          now = datetime.now(
              timezone.utc
          ).astimezone()

          now_iso = now.isoformat()

          print("")
          print("========================================")
          print("SHORTPROMPT TREND RADAR V2.1")
          print("========================================")
          print(f"Timestamp: {now_iso}")
          print("")


          # ============================================================
          # GOOGLE TRENDS NAMESPACE
          # ============================================================

          HT_NS = "https://trends.google.com/trending/rss"


          # ============================================================
          # HELPERS
          # ============================================================

          def clean_text(value):

              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()


          def normalize_title(value):

              """
              Strong normalization.

              Examples:

              genoa frosinone
              genoa - frosinone
              genoa – frosinone
              genoa — frosinone

              become:

              genoa frosinone
              """

              value = clean_text(
                  value
              ).lower()

              value = unicodedata.normalize(
                  "NFKD",
                  value
              )

              value = "".join(
                  char
                  for char in value
                  if not unicodedata.combining(char)
              )

              value = value.replace(
                  "&",
                  " and "
              )

              value = re.sub(
                  r"[\u2010-\u2015\u2212\-]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"[^\w\s]",
                  " ",
                  value,
                  flags=re.UNICODE
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def legacy_normalize_title(value):

              """
              Original V2 normalization.

              Used only for compatibility with existing
              history/state data.
              """

              value = clean_text(
                  value
              ).lower()

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def title_matches(
              title_a,
              title_b
          ):

              if not title_a or not title_b:
                  return False

              return (
                  normalize_title(title_a)
                  ==
                  normalize_title(title_b)
              )


          def safe_int(value, default=0):

              try:
                  return int(value)
              except Exception:
                  return default


          def safe_float(value, default=0):

              try:
                  return float(value)
              except Exception:
                  return default


          # ============================================================
          # TRAFFIC BANDS
          # ============================================================

          TRAFFIC_BANDS = {
              "100+": 100,
              "200+": 200,
              "500+": 500,
              "1000+": 1000,
              "2000+": 2000,
              "5000+": 5000,
              "10000+": 10000,
              "20000+": 20000,
              "50000+": 50000,
              "100000+": 100000,
              "200000+": 200000,
              "500000+": 500000,
              "1000000+": 1000000
          }


          TRAFFIC_LEVELS = {
              label: index + 1
              for index, label
              in enumerate(
                  TRAFFIC_BANDS.keys()
              )
          }


          def parse_traffic_band(value):

              if not value:

                  return {
                      "label": "",
                      "level": 0,
                      "lower_bound": 0
                  }

              value = (
                  str(value)
                  .strip()
                  .upper()
                  .replace(",", "")
              )

              if value in TRAFFIC_BANDS:

                  return {
                      "label": value,
                      "level": TRAFFIC_LEVELS[value],
                      "lower_bound":
                          TRAFFIC_BANDS[value]
                  }

              match = re.match(
                  r"([0-9.]+)\s*([KMB]?)\+?",
                  value
              )

              if not match:

                  return {
                      "label": value,
                      "level": 0,
                      "lower_bound": 0
                  }

              number = float(
                  match.group(1)
              )

              suffix = match.group(2)

              multipliers = {
                  "": 1,
                  "K": 1000,
                  "M": 1000000,
                  "B": 1000000000
              }

              lower_bound = int(
                  number *
                  multipliers.get(
                      suffix,
                      1
                  )
              )

              return {
                  "label": value,
                  "level": lower_bound,
                  "lower_bound": lower_bound
              }


          def get_traffic_level(
              trend
          ):

              """
              Compatibility helper.

              Handles:

              V2:
                traffic_level = integer

              Older / malformed:
                traffic = string

              Future:
                traffic = dict
              """

              value = trend.get(
                  "traffic_level"
              )

              if value is not None:

                  try:
                      return int(value)
                  except Exception:
                      pass

              traffic = trend.get(
                  "traffic"
              )

              if isinstance(
                  traffic,
                  dict
              ):

                  if "level" in traffic:

                      try:
                          return int(
                              traffic["level"]
                          )
                      except Exception:
                          pass

                  if "label" in traffic:

                      return parse_traffic_band(
                          traffic["label"]
                      )["level"]

              if isinstance(
                  traffic,
                  str
              ):

                  return parse_traffic_band(
                      traffic
                  )["level"]

              if isinstance(
                  traffic,
                  int
              ):

                  return int(
                      traffic
                  )

              return 0


          def get_traffic_label(
              trend
          ):

              traffic = trend.get(
                  "traffic"
              )

              if isinstance(
                  traffic,
                  dict
              ):

                  label = traffic.get(
                      "label"
                  )

                  if label:
                      return str(label)

              if traffic:

                  return str(
                      traffic
                  )

              return ""


          def get_traffic_value(
              trend
          ):

              value = trend.get(
                  "traffic_value"
              )

              if value is not None:

                  try:
                      return int(value)
                  except Exception:
                      pass

              traffic = trend.get(
                  "traffic"
              )

              if isinstance(
                  traffic,
                  dict
              ):

                  value = traffic.get(
                      "lower_bound"
                  )

                  if value is not None:

                      try:
                          return int(value)
                      except Exception:
                          pass

              if isinstance(
                  traffic,
                  str
              ):

                  return parse_traffic_band(
                      traffic
                  )["lower_bound"]

              if isinstance(
                  traffic,
                  int
              ):

                  return traffic

              return 0


          # ============================================================
          # CATEGORIES
          # ============================================================

          CATEGORY_KEYWORDS = {

              "AI": [
                  "ai",
                  "intelligenza artificiale",
                  "artificial intelligence",
                  "chatgpt",
                  "gemini",
                  "claude",
                  "openai",
                  "anthropic",
                  "deepmind",
                  "copilot",
                  "llm",
                  "machine learning",
                  "robot",
                  "robotica",
                  "artificial",
                  "nvidia"
              ],

              "Tech": [
                  "apple",
                  "iphone",
                  "ipad",
                  "android",
                  "samsung",
                  "google",
                  "microsoft",
                  "windows",
                  "linux",
                  "meta",
                  "tesla",
                  "intel",
