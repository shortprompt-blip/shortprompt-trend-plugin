name: ShortPrompt Trend Radar

on:
  schedule:
    # Ogni 15 minuti.
    # Orari sfalsati per evitare i picchi allo scoccare dell'ora.
    - cron: '7,22,37,52 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-trends:

    name: Collect Google Trends

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # NODE.JS 24
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # ============================================================
      # VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify Node.js
        run: |
          node --version
          npm --version
          python3 --version

      # ============================================================
      # COLLECT GOOGLE TRENDS RSS
      # ============================================================

      - name: Collect Google Trends
        env:
          TZ: Europe/Rome
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET

          from datetime import (
              datetime,
              timezone,
              timedelta
          )

          from pathlib import Path


          # ============================================================
          # CONFIGURATION
          # ============================================================

          RSS_URL = (
              "https://trends.google.com/"
              "trending/rss?geo=IT"
          )

          DATA_DIR = Path("data")

          HISTORY_DIR = (
              DATA_DIR /
              "history"
          )

          DATA_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          HISTORY_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          HT_NS = (
              "https://trends.google.com/trending/rss"
          )


          # ============================================================
          # CURRENT TIME
          # ============================================================

          now = datetime.now(
              timezone.utc
          )

          timestamp = now.isoformat()

          date_key = now.strftime(
              "%Y-%m-%d"
          )

          time_key = now.strftime(
              "%H:%M"
          )


          # ============================================================
          # DOWNLOAD GOOGLE TRENDS RSS
          # ============================================================

          request = urllib.request.Request(
              RSS_URL,
              headers={
                  "User-Agent":
                      "ShortPrompt-Trend-Radar/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  xml_data = response.read()

          except Exception as error:

              print(
                  "ERROR: Google Trends RSS "
                  f"download failed: {error}"
              )

              sys.exit(1)


          print(
              f"RSS downloaded: "
              f"{len(xml_data)} bytes"
          )


          # ============================================================
          # PARSE XML
          # ============================================================

          try:

              root = ET.fromstring(
                  xml_data
              )

          except Exception as error:

              print(
                  "ERROR: XML parsing failed: "
                  f"{error}"
              )

              sys.exit(1)


          channel = root.find(
              "channel"
          )

          if channel is None:

              print(
                  "ERROR: RSS channel not found"
              )

              sys.exit(1)


          # ============================================================
          # HELPERS
          # ============================================================

          def get_text(element):

              if element is None:
                  return ""

              return (
                  element.text or ""
              ).strip()


          def parse_traffic(value):

              """
              Converts Google approximate traffic:

              100+
              200+
              1,000+
              10K+
              100K+
              1M+

              into numeric values.
              """

              if not value:
                  return 0

              value = (
                  value
                  .strip()
                  .upper()
                  .replace("+", "")
                  .replace(" ", "")
              )

              multiplier = 1

              if value.endswith("K"):

                  multiplier = 1000
                  value = value[:-1]

              elif value.endswith("M"):

                  multiplier = 1000000
                  value = value[:-1]

              elif value.endswith("B"):

                  multiplier = 1000000000
                  value = value[:-1]

              value = value.replace(
                  ",",
                  "."
              )

              try:

                  return int(
                      float(value) *
                      multiplier
                  )

              except Exception:

                  return 0


          def traffic_score(traffic):

              """
              Base Google traffic signal.

              This is NOT a growth metric.
              """

              if traffic >= 1000000:
                  return 40

              if traffic >= 100000:
                  return 36

              if traffic >= 10000:
                  return 32

              if traffic >= 5000:
                  return 28

              if traffic >= 1000:
                  return 24

              if traffic >= 500:
                  return 20

              if traffic >= 200:
                  return 15

              if traffic >= 100:
                  return 10

              return 5


          def detect_category(
              title,
              article_titles
          ):

              text = (
                  title +
                  " " +
                  " ".join(
                      article_titles
                  )
              ).lower()


              categories = {

                  "AI": [

                      "ai",
                      "artificial intelligence",
                      "intelligenza artificiale",
                      "chatgpt",
                      "gemini",
                      "claude",
                      "openai",
                      "anthropic",
                      "copilot",
                      "deepseek"

                  ],


                  "Tech": [

                      "iphone",
                      "ipad",
                      "android",
                      "samsung",
                      "google",
                      "microsoft",
                      "apple",
                      "windows",
                      "linux",
                      "tesla",
                      "nvidia",
                      "meta",
                      "amazon"

                  ],


                  "Sport": [

                      "calcio",
                      "serie a",
                      "serie b",
                      "serie c",
                      "champions",
                      "europa league",
                      "nba",
                      "tennis",
                      "formula 1",
                      "f1",
                      "moto gp",
                      "motogp",
                      "football",
                      "basket",
                      "golf",
                      "fiorentina",
                      "milan",
                      "inter",
                      "juventus",
                      "roma",
                      "napoli",
                      "lazio"

                  ],


                  "Entertainment": [

                      "netflix",
                      "film",
                      "serie tv",
                      "serie",
                      "attore",
                      "attrice",
                      "cantante",
                      "musica",
                      "cinema",
                      "reality",
                      "tv",
                      "disney",
                      "prime video"

                  ],


                  "Business": [

                      "borsa",
                      "azioni",
                      "mercato",
                      "economia",
                      "banca",
                      "euro",
                      "dollaro",
                      "inflazione",
                      "investimenti"

                  ]

              }


              for category, keywords in categories.items():

                  for keyword in keywords:

                      if keyword in text:

                          return category


              return "News"


          # ============================================================
          # READ TRENDS
          # ============================================================

          trends = []


          for item in channel.findall(
              "item"
          ):

              title = get_text(
                  item.find("title")
              )

              pub_date = get_text(
                  item.find("pubDate")
              )


              if not title:
                  continue


              traffic_element = item.find(
                  f"{{{HT_NS}}}approx_traffic"
              )

              traffic_raw = get_text(
                  traffic_element
              )

              traffic = parse_traffic(
                  traffic_raw
              )


              picture = get_text(
                  item.find(
                      f"{{{HT_NS}}}picture"
                  )
              )


              picture_source = get_text(
                  item.find(
                      f"{{{HT_NS}}}picture_source"
                  )
              )


              # --------------------------------------------------------
              # NEWS
              # --------------------------------------------------------

              news_items = []


              for news in item.findall(
                  f"{{{HT_NS}}}news_item"
              ):

                  news_title = get_text(
                      news.find(
                          f"{{{HT_NS}}}news_item_title"
                      )
                  )

                  news_url = get_text(
                      news.find(
                          f"{{{HT_NS}}}news_item_url"
                      )
                  )

                  news_source = get_text(
                      news.find(
                          f"{{{HT_NS}}}news_item_source"
                      )
                  )

                  news_picture = get_text(
                      news.find(
                          f"{{{HT_NS}}}news_item_picture"
                      )
                  )


                  if news_title:

                      news_items.append({

                          "title":
                              news_title,

                          "url":
                              news_url,

                          "source":
                              news_source,

                          "picture":
                              news_picture

                      })


              article_titles = [

                  item["title"]

                  for item in news_items

              ]


              sources = sorted(
                  list(
                      set(

                          item["source"]

                          for item in news_items

                          if item["source"]

                      )
                  )
              )


              news_count = len(
                  news_items
              )

              source_count = len(
                  sources
              )


              # ========================================================
              # BASE SCORE
              # ========================================================

              search_score = traffic_score(
                  traffic
              )

              news_score = min(
                  20,
                  news_count * 7
              )

              source_score = min(
                  10,
                  source_count * 4
              )

              recency_score = 30


              score = (

                  search_score +
                  news_score +
                  source_score +
                  recency_score

              )


              score = max(
                  0,
                  min(
                      100,
                      score
                  )
              )


              category = detect_category(
                  title,
                  article_titles
              )


              trends.append({

                  "title":
                      title,

                  "pub_date":
                      pub_date,

                  "traffic": {

                      "raw":
                          traffic_raw,

                      "approx":
                          traffic

                  },

                  "score":
                      score,

                  "category":
                      category,

                  "picture":
                      picture,

                  "picture_source":
                      picture_source,

                  "news_count":
                      news_count,

                  "source_count":
                      source_count,

                  "sources":
                      sources,

                  "news":
                      news_items,

                  "google_trends_url":
                      RSS_URL

              })


          # ============================================================
          # SORT BY SCORE
          # ============================================================

          trends.sort(
              key=lambda trend:
                  trend["score"],
              reverse=True
          )


          # ============================================================
          # CREATE SNAPSHOT
          # ============================================================

          snapshot = {

              "timestamp":
                  timestamp,

              "date":
                  date_key,

              "time":
                  time_key,

              "geo":
                  "IT",

              "source":
                  "Google Trends Trending Now RSS",

              "source_url":
                  RSS_URL,

              "trend_count":
                  len(trends),

              "trends":
                  trends

          }


          # ============================================================
          # HISTORY FILE
          # ============================================================

          history_file = (

              HISTORY_DIR /
              f"{date_key}.json"

          )


          if history_file.exists():

              try:

                  with history_file.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      history = json.load(
                          file
                      )

              except Exception:

                  history = {

                      "date":
                          date_key,

                      "geo":
                          "IT",

                      "source":
                          "Google Trends Trending Now RSS",

                      "snapshots":
                          []

                  }

          else:

              history = {

                  "date":
                      date_key,

                  "geo":
                      "IT",

                  "source":
                      "Google Trends Trending Now RSS",

                  "snapshots":
                      []

              }


          # ============================================================
          # ADD SNAPSHOT
          # ============================================================

          history[
              "snapshots"
          ].append(
              snapshot
          )


          # ============================================================
          # KEEP LAST 24 HOURS
          # ============================================================

          cutoff = (
              now -
              timedelta(hours=24)
          )


          filtered_snapshots = []


          for snapshot_item in history[
              "snapshots"
          ]:

              try:

                  snapshot_time = (
                      datetime.fromisoformat(
                          snapshot_item[
                              "timestamp"
                          ].replace(
                              "Z",
                              "+00:00"
                          )
                      )
                  )


                  if snapshot_time >= cutoff:

                      filtered_snapshots.append(
                          snapshot_item
                      )

              except Exception:

                  pass


          history[
              "snapshots"
          ] = filtered_snapshots


          # ============================================================
          # SAVE DAILY HISTORY
          # ============================================================

          with history_file.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  history,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          # ============================================================
          # SAVE LATEST
          # ============================================================

          latest_file = (
              DATA_DIR /
              "latest.json"
          )


          with latest_file.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  snapshot,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          # ============================================================
          # DELETE HISTORY OLDER THAN 30 DAYS
          # ============================================================

          keep_after = (
              now -
              timedelta(days=30)
          )


          for history_path in HISTORY_DIR.glob(
              "*.json"
          ):

              try:

                  file_date = (
                      datetime.strptime(
                          history_path.stem,
                          "%Y-%m-%d"
                      ).replace(
                          tzinfo=timezone.utc
                      )
                  )


                  if file_date < keep_after:

                      history_path.unlink()

                      print(
                          "Deleted old history:",
                          history_path
                      )

              except Exception:

                  pass


          # ============================================================
          # CONSOLE OUTPUT
          # ============================================================

          print("")
          print(
              "========================================"
          )
          print(
              "SHORTPROMPT TREND RADAR"
          )
          print(
              "========================================"
          )

          print(
              f"Timestamp: {timestamp}"
          )

          print(
              f"Trends: {len(trends)}"
          )

          print("")


          for index, trend in enumerate(
              trends,
              start=1
          ):

              print(

                  f"{index}. "
                  f"{trend['title']} | "
                  f"{trend['traffic']['raw']} | "
                  f"Score {trend['score']} | "
                  f"{trend['category']}"

              )


          print("")

          print(
              f"Saved: {history_file}"
          )

          print(
              f"Latest: {latest_file}"
          )

          PY

      # ============================================================
      # COMMIT DATA
      # ============================================================

      - name: Commit Trend Radar data
        run: |

          git config user.name \
            "ShortPrompt Trend Radar"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/


          if git diff --cached --quiet; then

            echo "No data changes to commit."

            exit 0

          fi


          git commit \
            -m "Update Trend Radar data"


          git push
