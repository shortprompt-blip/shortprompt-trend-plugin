name: ShortPrompt Trend Radar V2

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-trends:
    name: Collect and Analyze Google Trends V2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify environment
        run: |
          node --version
          npm --version
          python3 --version

      - name: Collect and analyze Google Trends
        env:
          TZ: Europe/Rome
        run: |
          python3 <<'PY'

          import json
          import math
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          from datetime import datetime, timedelta, timezone
          from pathlib import Path


          # ============================================================
          # CONFIGURATION
          # ============================================================

          FEED_URL = "https://trends.google.com/trending/rss?geo=IT"

          DATA_DIR = Path("data")
          HISTORY_DIR = DATA_DIR / "history"

          LATEST_FILE = DATA_DIR / "latest.json"
          STATE_FILE = DATA_DIR / "trends-state.json"

          HISTORY_HOURS = 72
          STATE_RETENTION_DAYS = 14

          DATA_DIR.mkdir(parents=True, exist_ok=True)
          HISTORY_DIR.mkdir(parents=True, exist_ok=True)


          # ============================================================
          # TIME
          # ============================================================

          now = datetime.now(timezone.utc).astimezone()
          now_iso = now.isoformat()

          print("========================================")
          print("SHORTPROMPT TREND RADAR V2")
          print("========================================")
          print(f"Timestamp: {now_iso}")
          print("")


          # ============================================================
          # GOOGLE TRENDS NAMESPACE
          # ============================================================

          HT_NS = "https://trends.google.com/trending/rss"


          # ============================================================
          # HELPERS
          # ============================================================

          def clean_text(value):

              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()


          def normalize_title(value):

              value = clean_text(value).lower()

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # ============================================================
          # TRAFFIC BANDS
          #
          # IMPORTANT:
          # Google RSS exposes approximate traffic bands.
          # We therefore DO NOT interpret 500+ as exactly 500.
          # ============================================================

          TRAFFIC_BANDS = {
              "100+": 100,
              "200+": 200,
              "500+": 500,
              "1000+": 1000,
              "2000+": 2000,
              "5000+": 5000,
              "10000+": 10000,
              "20000+": 20000,
              "50000+": 50000,
              "100000+": 100000,
              "200000+": 200000,
              "500000+": 500000,
              "1000000+": 1000000
          }


          def parse_traffic_band(value):

              if not value:
                  return {
                      "label": "",
                      "level": 0,
                      "lower_bound": 0
                  }

              value = (
                  str(value)
                  .strip()
                  .upper()
                  .replace(",", "")
              )

              if value in TRAFFIC_BANDS:

                  return {
                      "label": value,
                      "level": list(
                          TRAFFIC_BANDS.keys()
                      ).index(value) + 1,
                      "lower_bound": TRAFFIC_BANDS[value]
                  }

              match = re.match(
                  r"([0-9.]+)\s*([KMB]?)\+?",
                  value
              )

              if not match:

                  return {
                      "label": value,
                      "level": 0,
                      "lower_bound": 0
                  }

              number = float(match.group(1))
              suffix = match.group(2)

              multipliers = {
                  "": 1,
                  "K": 1000,
                  "M": 1000000,
                  "B": 1000000000
              }

              lower_bound = int(
                  number *
                  multipliers.get(
                      suffix,
                      1
                  )
              )

              return {
                  "label": value,
                  "level": lower_bound,
                  "lower_bound": lower_bound
              }


          # ============================================================
          # CATEGORIES
          # ============================================================

          CATEGORY_KEYWORDS = {

              "AI": [
                  "ai",
                  "intelligenza artificiale",
                  "chatgpt",
                  "gemini",
                  "claude",
                  "openai",
                  "anthropic",
                  "deepmind",
                  "copilot",
                  "llm",
                  "machine learning",
                  "robot",
                  "robotica"
              ],

              "Tech": [
                  "apple",
                  "iphone",
                  "ipad",
                  "android",
                  "samsung",
                  "google",
                  "microsoft",
                  "windows",
                  "linux",
                  "meta",
                  "tesla",
                  "nvidia",
                  "intel",
                  "amd",
                  "sony",
                  "playstation",
                  "xbox",
                  "whatsapp",
                  "instagram",
                  "facebook",
                  "tiktok",
                  "youtube",
                  "netflix",
                  "spotify",
                  "honor"
              ],

              "Sport": [
                  "calcio",
                  "serie a",
                  "serie b",
                  "serie c",
                  "champions",
                  "europa league",
                  "conference league",
                  "mondiali",
                  "formula 1",
                  "f1",
                  "motogp",
                  "tennis",
                  "basket",
                  "nba",
                  "atp",
                  "wta",
                  "olimpiadi",
                  "giro d'italia",
                  "tour de france",
                  "volley",
                  "volley",
                  "juventus",
                  "milan",
                  "inter",
                  "roma",
                  "napoli",
                  "atalanta"
              ],

              "Entertainment": [
                  "film",
                  "cinema",
                  "serie tv",
                  "serie",
                  "netflix",
                  "prime video",
                  "disney",
                  "attore",
                  "attrice",
                  "cantante",
                  "concerto",
                  "musica",
                  "festival",
                  "reality",
                  "grande fratello",
                  "sanremo",
                  "tv",
                  "fiction",
                  "personaggio"
              ],

              "Business": [
                  "borsa",
                  "azioni",
                  "bitcoin",
                  "ethereum",
                  "crypto",
                  "criptovalute",
                  "economia",
                  "inflazione",
                  "bce",
                  "fed",
                  "banche",
                  "tim",
                  "enel",
                  "eni",
                  "stellantis",
                  "finanza",
                  "mercato",
                  "licenziamento",
                  "edilizia"
              ]
          }


          def classify_category(
              title,
              news_titles
          ):

              text = " ".join(
                  [title] +
                  [
                      item
                      for item in news_titles
                      if item
                  ]
              ).lower()

              scores = {}

              for category, keywords in CATEGORY_KEYWORDS.items():

                  score = 0

                  for keyword in keywords:

                      if keyword in text:
                          score += 1

                  scores[category] = score

              best_category = max(
                  scores,
                  key=scores.get
              )

              if scores[best_category] == 0:
                  return "News"

              return best_category


          # ============================================================
          # FETCH RSS
          # ============================================================

          print("Fetching Google Trends RSS...")

          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; "
                      "ShortPrompt-Trend-Radar/2.0)"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  xml_data = response.read()

          except Exception as error:

              print(
                  f"ERROR fetching Google Trends: {error}"
              )

              raise


          print(
              f"RSS downloaded: "
              f"{len(xml_data)} bytes"
          )


          # ============================================================
          # PARSE XML
          # ============================================================

          try:

              root = ET.fromstring(
                  xml_data
              )

          except Exception as error:

              print(
                  f"ERROR parsing XML: {error}"
              )

              raise


          channel = root.find("channel")

          if channel is None:

              raise RuntimeError(
                  "Google Trends RSS channel not found."
              )


          trends = []


          for item in channel.findall("item"):

              title = clean_text(
                  item.findtext("title")
              )

              if not title:
                  continue


              key = normalize_title(
                  title
              )


              description = clean_text(
                  item.findtext("description")
              )


              pub_date = clean_text(
                  item.findtext("pubDate")
              )


              traffic_raw = clean_text(
                  item.findtext(
                      f"{{{HT_NS}}}approx_traffic"
                  )
              )


              traffic = parse_traffic_band(
                  traffic_raw
              )


              picture = clean_text(
                  item.findtext(
                      f"{{{HT_NS}}}picture"
                  )
              )


              picture_source = clean_text(
                  item.findtext(
                      f"{{{HT_NS}}}picture_source"
                  )
              )


              news_items = []


              for news in item.findall(
                  f"{{{HT_NS}}}news_item"
              ):

                  news_title = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}news_item_title"
                      )
                  )


                  news_snippet = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}news_item_snippet"
                      )
                  )


                  news_url = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}news_item_url"
                      )
                  )


                  news_picture = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}news_item_picture"
                      )
                  )


                  news_source = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}news_item_source"
                      )
                  )


                  news_items.append({

                      "title": news_title,

                      "snippet": news_snippet,

                      "url": news_url,

                      "picture": news_picture,

                      "source": news_source

                  })


              news_titles = [
                  news["title"]
                  for news in news_items
                  if news["title"]
              ]


              sources = sorted(
                  set(
                      news["source"]
                      for news in news_items
                      if news["source"]
                  )
              )


              category = classify_category(
                  title,
                  news_titles
              )


              trends.append({

                  "title": title,

                  "key": key,

                  "traffic": traffic["label"],

                  "traffic_level":
                      traffic["level"],

                  "traffic_value":
                      traffic["lower_bound"],

                  "description":
                      description,

                  "google_pub_date":
                      pub_date,

                  "picture":
                      picture,

                  "picture_source":
                      picture_source,

                  "news_count":
                      len(news_items),

                  "source_count":
                      len(sources),

                  "sources":
                      sources,

                  "category":
                      category,

                  "news":
                      news_items

              })


          print(
              f"Trends found: "
              f"{len(trends)}"
          )


          # ============================================================
          # LOAD STATE
          # ============================================================

          state = {}


          if STATE_FILE.exists():

              try:

                  with STATE_FILE.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      loaded_state = json.load(
                          file
                      )


                  if isinstance(
                      loaded_state,
                      dict
                  ):

                      state = loaded_state


              except Exception as error:

                  print(
                      "WARNING: could not load "
                      f"{STATE_FILE}: {error}"
                  )

                  state = {}


          # ============================================================
          # LOAD LAST 72 HOURS OF HISTORY
          # ============================================================

          recent_snapshots = []

          history_cutoff = (
              now -
              timedelta(
                  hours=HISTORY_HOURS
              )
          )


          for history_file in sorted(
              HISTORY_DIR.glob("*.json")
          ):

              try:

                  with history_file.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      history_data = json.load(
                          file
                      )

              except Exception:

                  continue


              if not isinstance(
                  history_data,
                  list
              ):

                  continue


              for snapshot in history_data:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue


                  try:

                      timestamp = datetime.fromisoformat(
                          timestamp_raw
                      )

                  except Exception:

                      continue


                  if timestamp >= history_cutoff:

                      recent_snapshots.append(
                          snapshot
                      )


          recent_snapshots.sort(
              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )
          )


          print(
              f"Recent snapshots loaded: "
              f"{len(recent_snapshots)}"
          )


          # ============================================================
          # FIND HISTORICAL SNAPSHOT
          # ============================================================

          def find_previous(
              key,
              minutes
          ):

              target = (
                  now -
                  timedelta(
                      minutes=minutes
                  )
              )


              best = None
              best_delta = None


              for snapshot in recent_snapshots:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue


                  try:

                      timestamp = datetime.fromisoformat(
                          timestamp_raw
                      )

                  except Exception:

                      continue


                  if timestamp > target:
                      continue


                  delta = (
                      target -
                      timestamp
                  )


                  if (
                      best_delta is None
                      or
                      delta < best_delta
                  ):

                      best = snapshot
                      best_delta = delta


              if best is None:
                  return None


              for historical_trend in best.get(
                  "trends",
                  []
              ):

                  if (
                      historical_trend.get(
                          "key"
                      )
                      ==
                      key
                  ):

                      return historical_trend


              return None


          # ============================================================
          # FIND RECENT OCCURRENCES
          # ============================================================

          def count_recent_occurrences(
              key,
              minutes
          ):

              cutoff = (
                  now -
                  timedelta(
                      minutes=minutes
                  )
              )

              count = 0

              for snapshot in recent_snapshots:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue


                  try:

                      timestamp = datetime.fromisoformat(
                          timestamp_raw
                      )

                  except Exception:

                      continue


                  if timestamp < cutoff:
                      continue


                  for trend in snapshot.get(
                      "trends",
                      []
                  ):

                      if (
                          trend.get("key")
                          ==
                          key
                      ):

                          count += 1
                          break


              return count


          # ============================================================
          # TRAFFIC BAND COMPARISON
          # ============================================================

          def band_change(
              current_level,
              previous
          ):

              if previous is None:
                  return None


              old_level = int(
                  previous.get(
                      "traffic_level",
                      0
                  )
              )


              if old_level <= 0:
                  return None


              return (
                  current_level -
                  old_level
              )


          def band_direction(
              change
          ):

              if change is None:
                  return "UNKNOWN"

              if change > 0:
                  return "UP"

              if change < 0:
                  return "DOWN"

              return "FLAT"


          # ============================================================
          # SCORE COMPONENTS
          # ============================================================

          def volume_score(
              traffic_level
          ):

              if traffic_level <= 0:
                  return 0


              score = (
                  math.log10(
                      traffic_level + 1
                  )
                  /
                  math.log10(
                      14
                  )
              ) * 25


              return min(
                  25,
                  round(
                      score,
                      1
                  )
              )


          def acceleration_score(
              changes
          ):

              valid = [
                  change
                  for change in changes
                  if isinstance(
                      change,
                      int
                  )
                  or
                  isinstance(
                      change,
                      float
                  )
              ]


              if not valid:
                  return 0


              positive = [
                  change
                  for change in valid
                  if change > 0
              ]


              if not positive:
                  return 0


              weighted = 0


              weights = [
                  5,
                  4,
                  3,
                  2,
                  1
              ]


              for index, change in enumerate(
                  valid[:5]
              ):

                  if change > 0:

                      weighted += (
                          change *
                          weights[index]
                      )


              score = min(
                  30,
                  weighted * 2.5
              )


              return round(
                  score,
                  1
              )


          def persistence_score(
              appearances
          ):

              return min(
                  15,
                  round(
                      appearances *
                      0.8,
                      1
                  )
              )


          def new_entry_score(
              appearances
          ):

              if appearances <= 1:
                  return 15

              if appearances == 2:
                  return 10

              if appearances <= 4:
                  return 5

              return 0


          def news_score(
              news_count,
              source_count
          ):

              score = (
                  min(
                      6,
                      news_count * 1.5
                  )
                  +
                  min(
                      4,
                      source_count * 2
                  )
              )

              return round(
                  min(
                      10,
                      score
                  ),
                  1
              )


          def recurrence_score(
              occurrences
          ):

              return min(
                  5,
                  round(
                      occurrences *
                      0.5,
                      1
                  )
              )


          # ============================================================
          # ENRICH TRENDS
          # ============================================================

          enriched_trends = []


          for trend in trends:

              key = trend["key"]


              previous_state = state.get(
                  key,
                  {}
              )


              first_seen = (
                  previous_state.get(
                      "first_seen"
                  )
                  or
                  now_iso
              )


              appearances = int(
                  previous_state.get(
                      "appearances",
                      0
                  )
              ) + 1


              # --------------------------------------------------------
              # Historical comparisons
              # --------------------------------------------------------

              previous_30m = find_previous(
                  key,
                  30
              )

              previous_1h = find_previous(
                  key,
                  60
              )

              previous_3h = find_previous(
                  key,
                  180
              )

              previous_6h = find_previous(
                  key,
                  360
              )

              previous_24h = find_previous(
                  key,
                  1440
              )


              change_30m = band_change(
                  trend["traffic_level"],
                  previous_30m
              )


              change_1h = band_change(
                  trend["traffic_level"],
                  previous_1h
              )


              change_3h = band_change(
                  trend["traffic_level"],
                  previous_3h
              )


              change_6h = band_change(
                  trend["traffic_level"],
                  previous_6h
              )


              change_24h = band_change(
                  trend["traffic_level"],
                  previous_24h
              )


              changes = [

                  change_30m,

                  change_1h,

                  change_3h,

                  change_6h,

                  change_24h

              ]


              # --------------------------------------------------------
              # Recurrence
              # --------------------------------------------------------

              occurrences_1h = count_recent_occurrences(
                  key,
                  60
              )

              occurrences_3h = count_recent_occurrences(
                  key,
                  180
              )

              occurrences_6h = count_recent_occurrences(
                  key,
                  360
              )


              # --------------------------------------------------------
              # Duration
              # --------------------------------------------------------

              try:

                  first_seen_dt = datetime.fromisoformat(
                      first_seen
                  )


                  duration_seconds = max(
                      0,
                      int(
                          (
                              now -
                              first_seen_dt
                          ).total_seconds()
                      )
                  )


              except Exception:

                  duration_seconds = 0


              duration_minutes = (
                  duration_seconds //
                  60
              )


              # --------------------------------------------------------
              # Score
              # --------------------------------------------------------

              score = (

                  volume_score(
                      trend["traffic_level"]
                  )

                  +

                  acceleration_score(
                      changes
                  )

                  +

                  persistence_score(
                      appearances
                  )

                  +

                  new_entry_score(
                      appearances
                  )

                  +

                  news_score(
                      trend["news_count"],
                      trend["source_count"]
                  )

                  +

                  recurrence_score(
                      occurrences_1h
                  )

              )


              score = min(
                  100,
                  round(
                      score,
                      1
                  )
              )


              # ========================================================
              # ACCELERATION CLASSIFICATION
              # ========================================================

              acceleration = "NONE"


              positive_short = (
                  change_30m is not None
                  and
                  change_30m > 0
              )


              positive_medium = (
                  change_1h is not None
                  and
                  change_1h > 0
              )


              positive_long = (
                  change_3h is not None
                  and
                  change_3h > 0
              )


              if (
                  change_30m is not None
                  and
                  change_1h is not None
                  and
                  change_30m >= 2
                  and
                  change_1h >= 2
              ):

                  acceleration = "STRONG"


              elif (
                  positive_short
                  and
                  positive_medium
              ):

                  acceleration = "MEDIUM"


              elif positive_medium or positive_long:

                  acceleration = "WEAK"


              # ========================================================
              # STATUS
              # ========================================================

              status = "HOT"


              # New trend
              if (
                  appearances <= 1
                  and
                  (
                      trend["traffic_level"] >= 2
                      or
                      trend["news_count"] >= 2
                  )
              ):

                  status = "EMERGING"


              # Strong acceleration
              elif (
                  acceleration == "STRONG"
                  and
                  (
                      appearances >= 2
                      or
                      trend["traffic_level"] >= 3
                  )
              ):

                  status = "ACCELERATING"


              # Rising
              elif (
                  acceleration in [
                      "MEDIUM",
                      "STRONG"
                  ]
                  and
                  (
                      occurrences_1h >= 2
                      or
                      trend["traffic_level"] >= 3
                  )
              ):

                  status = "RISING"


              # Cooling
              elif (
                  change_6h is not None
                  and
                  change_6h <= -2
                  and
                  trend["traffic_level"] <= 3
              ):

                  status = "COOLING"


              # Stable
              elif (
                  appearances >= 4
                  and
                  all(
                      change is None
                      or
                      change == 0
                      for change in [
                          change_1h,
                          change_3h
                      ]
                  )
              ):

                  status = "STABLE"


              # Otherwise HOT
              else:

                  status = "HOT"


              # ========================================================
              # FIRST SEEN / STATE
              # ========================================================

              state[key] = {

                  "title":
                      trend["title"],

                  "first_seen":
                      first_seen,

                  "last_seen":
                      now_iso,

                  "appearances":
                      appearances,

                  "last_traffic":
                      trend["traffic"],

                  "last_traffic_level":
                      trend["traffic_level"],

                  "last_traffic_value":
                      trend["traffic_value"],

                  "category":
                      trend["category"],

                  "status":
                      status,

                  "acceleration":
                      acceleration,

                  "score":
                      score

              }


              # ========================================================
              # OUTPUT
              # ========================================================

              enriched_trends.append({

                  "title":
                      trend["title"],

                  "key":
                      key,

                  "category":
                      trend["category"],

                  "status":
                      status,

                  "acceleration":
                      acceleration,

                  "score":
                      score,

                  "traffic":
                      trend["traffic"],

                  "traffic_level":
                      trend["traffic_level"],

                  "traffic_value":
                      trend["traffic_value"],

                  "first_seen":
                      first_seen,

                  "last_seen":
                      now_iso,

                  "appearances":
                      appearances,

                  "duration_minutes":
                      duration_minutes,

                  "change_30m_bands":
                      change_30m,

                  "change_1h_bands":
                      change_1h,

                  "change_3h_bands":
                      change_3h,

                  "change_6h_bands":
                      change_6h,

                  "change_24h_bands":
                      change_24h,

                  "direction_30m":
                      band_direction(
                          change_30m
                      ),

                  "direction_1h":
                      band_direction(
                          change_1h
                      ),

                  "direction_3h":
                      band_direction(
                          change_3h
                      ),

                  "occurrences_1h":
                      occurrences_1h,

                  "occurrences_3h":
                      occurrences_3h,

                  "occurrences_6h":
                      occurrences_6h,

                  "news_count":
                      trend["news_count"],

                  "source_count":
                      trend["source_count"],

                  "sources":
                      trend["sources"],

                  "picture":
                      trend["picture"],

                  "picture_source":
                      trend["picture_source"],

                  "news":
                      trend["news"]

              })


          # ============================================================
          # SORT
          # ============================================================

          enriched_trends.sort(

              key=lambda item: (

                  -float(
                      item.get(
                          "score",
                          0
                      )
                  ),

                  -int(
                      item.get(
                          "traffic_level",
                          0
                      )
                  )

              )

          )


          # ============================================================
          # RANK
          # ============================================================

          for index, trend in enumerate(
              enriched_trends,
              start=1
          ):

              trend["rank"] = index


          # ============================================================
          # LATEST JSON
          # ============================================================

          latest = {

              "version":
                  "2.0",

              "timestamp":
                  now_iso,

              "source":
                  "Google Trends RSS",

              "geo":
                  "IT",

              "feed_url":
                  FEED_URL,

              "history_hours":
                  HISTORY_HOURS,

              "trend_count":
                  len(
                      enriched_trends
                  ),

              "scoring": {

                  "volume":
                      25,

                  "acceleration":
                      30,

                  "persistence":
                      15,

                  "new_entry":
                      15,

                  "news_sources":
                      10,

                  "recent_recurrence":
                      5

              },

              "traffic_note":
                  "Google Trends RSS traffic values are approximate bands.",

              "trends":
                  enriched_trends

          }


          with LATEST_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  latest,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          # ============================================================
          # COMPACT HISTORY SNAPSHOT
          # ============================================================

          compact_snapshot = {

              "timestamp":
                  now_iso,

              "trends": [

                  {

                      "key":
                          trend["key"],

                      "title":
                          trend["title"],

                      "traffic":
                          trend["traffic"],

                      "traffic_level":
                          trend["traffic_level"],

                      "traffic_value":
                          trend["traffic_value"]

                  }

                  for trend in trends

              ]

          }


          # ============================================================
          # DAILY HISTORY FILE
          # ============================================================

          history_file = (

              HISTORY_DIR /

              f"{now.strftime('%Y-%m-%d')}.json"

          )


          day_history = []


          if history_file.exists():

              try:

                  with history_file.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      loaded_history = json.load(
                          file
                      )


                  if isinstance(
                      loaded_history,
                      list
                  ):

                      day_history = loaded_history


              except Exception as error:

                  print(
                      "WARNING: could not load "
                      f"{history_file}: {error}"
                  )

                  day_history = []


          day_history.append(
              compact_snapshot
          )


          # ============================================================
          # KEEP 72 HOURS
          # ============================================================

          cleaned_history = []


          for snapshot in day_history:

              timestamp_raw = snapshot.get(
                  "timestamp"
              )

              if not timestamp_raw:
                  continue


              try:

                  snapshot_time = datetime.fromisoformat(
                      timestamp_raw
                  )

              except Exception:

                  continue


              if snapshot_time >= history_cutoff:

                  cleaned_history.append(
                      snapshot
                  )


          cleaned_history.sort(

              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )

          )


          with history_file.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  cleaned_history,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          # ============================================================
          # DELETE OLD HISTORY FILES
          # ============================================================

          history_date_cutoff = (

              now.date()

              -

              timedelta(
                  days=4
              )

          )


          for old_file in HISTORY_DIR.glob(
              "*.json"
          ):

              try:

                  file_date = datetime.strptime(
                      old_file.stem,
                      "%Y-%m-%d"
                  ).date()

              except Exception:

                  continue


              if file_date < history_date_cutoff:

                  print(
                      f"Deleting old history: "
                      f"{old_file}"
                  )

                  old_file.unlink()


          # ============================================================
          # CLEAN STATE
          # ============================================================

          state_cutoff = (

              now

              -

              timedelta(
                  days=STATE_RETENTION_DAYS
              )

          )


          stale_keys = []


          for key, item in state.items():

              last_seen_raw = item.get(
                  "last_seen"
              )


              if not last_seen_raw:

                  stale_keys.append(
                      key
                  )

                  continue


              try:

                  last_seen = datetime.fromisoformat(
                      last_seen_raw
                  )

              except Exception:

                  stale_keys.append(
                      key
                  )

                  continue


              if last_seen < state_cutoff:

                  stale_keys.append(
                      key
                  )


          for key in stale_keys:

              del state[key]


          with STATE_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  state,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          # ============================================================
          # CONSOLE OUTPUT
          # ============================================================

          print("")
          print("========================================")
          print("TREND RADAR V2 RESULT")
          print("========================================")


          for trend in enriched_trends:

              print(

                  f"{trend['rank']:02d}. "

                  f"{trend['title']} | "

                  f"{trend['status']} | "

                  f"{trend['acceleration']} | "

                  f"{trend['score']}/100 | "

                  f"{trend['traffic']}"

              )


          print("")
          print("Generated files:")
          print(f"- {LATEST_FILE}")
          print(f"- {STATE_FILE}")
          print(f"- {history_file}")
          print("")


          PY

