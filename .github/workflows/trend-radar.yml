                  "milan",
                  "inter",
                  "roma",
                  "napoli",
                  "atalanta"
              ],

              "Entertainment": [
                  "film",
                  "movie",
                  "cinema",
                  "serie tv",
                  "tv series",
                  "netflix",
                  "prime video",
                  "disney",
                  "attore",
                  "attrice",
                  "actor",
                  "actress",
                  "cantante",
                  "singer",
                  "concerto",
                  "concert",
                  "musica",
                  "music",
                  "festival",
                  "reality",
                  "grande fratello",
                  "sanremo",
                  "tv",
                  "fiction",
                  "personaggio",
                  "celebrity"
              ],

              "Business": [
                  "borsa",
                  "stock market",
                  "stocks",
                  "azioni",
                  "bitcoin",
                  "ethereum",
                  "crypto",
                  "cryptocurrency",
                  "criptovalute",
                  "economia",
                  "economy",
                  "inflazione",
                  "inflation",
                  "bce",
                  "fed",
                  "banche",
                  "banks",
                  "tim",
                  "enel",
                  "eni",
                  "stellantis",
                  "finanza",
                  "finance",
                  "mercato",
                  "market",
                  "licenziamento",
                  "layoffs",
                  "edilizia"
              ]
          }


          def classify_category(
              title,
              news_titles
          ):

              text = " ".join(
                  [title] +
                  [
                      item
                      for item in news_titles
                      if item
                  ]
              ).lower()

              scores = {}

              for category, keywords in CATEGORY_KEYWORDS.items():

                  score = 0

                  for keyword in keywords:

                      if keyword in text:
                          score += 1

                  scores[category] = score

              best_category = max(
                  scores,
                  key=scores.get
              )

              if scores[best_category] == 0:
                  return "News"

              return best_category


          # ============================================================
          # FETCH RSS
          # ============================================================

          def fetch_rss(
              geo,
              url
          ):

              print(
                  f"Fetching Google Trends RSS: "
                  f"{geo}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 "
                          "(compatible; "
                          "ShortPrompt-Trend-Radar/2.1)"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      xml_data = response.read()

              except Exception as error:

                  print(
                      f"ERROR {geo}: "
                      f"{error}"
                  )

                  return []

              print(
                  f"{geo}: "
                  f"{len(xml_data)} bytes"
              )

              try:

                  root = ET.fromstring(
                      xml_data
                  )

              except Exception as error:

                  print(
                      f"ERROR parsing {geo}: "
                      f"{error}"
                  )

                  return []

              channel = root.find(
                  "channel"
              )

              if channel is None:

                  print(
                      f"WARNING: channel not found "
                      f"for {geo}"
                  )

                  return []

              trends = []

              for item in channel.findall(
                  "item"
              ):

                  title = clean_text(
                      item.findtext(
                          "title"
                      )
                  )

                  if not title:
                      continue

                  key = normalize_title(
                      title
                  )

                  description = clean_text(
                      item.findtext(
                          "description"
                      )
                  )

                  pub_date = clean_text(
                      item.findtext(
                          "pubDate"
                      )
                  )

                  traffic_raw = clean_text(
                      item.findtext(
                          f"{{{HT_NS}}}"
                          "approx_traffic"
                      )
                  )

                  traffic = parse_traffic_band(
                      traffic_raw
                  )

                  picture = clean_text(
                      item.findtext(
                          f"{{{HT_NS}}}picture"
                      )
                  )

                  picture_source = clean_text(
                      item.findtext(
                          f"{{{HT_NS}}}picture_source"
                      )
                  )

                  news_items = []

                  for news in item.findall(
                      f"{{{HT_NS}}}news_item"
                  ):

                      news_title = clean_text(
                          news.findtext(
                              f"{{{HT_NS}}}"
                              "news_item_title"
                          )
                      )

                      news_snippet = clean_text(
                          news.findtext(
                              f"{{{HT_NS}}}"
                              "news_item_snippet"
                          )
                      )

                      news_url = clean_text(
                          news.findtext(
                              f"{{{HT_NS}}}"
                              "news_item_url"
                          )
                      )

                      news_picture = clean_text(
                          news.findtext(
                              f"{{{HT_NS}}}"
                              "news_item_picture"
                          )
                      )

                      news_source = clean_text(
                          news.findtext(
                              f"{{{HT_NS}}}"
                              "news_item_source"
                          )
                      )

                      news_items.append({

                          "title":
                              news_title,

                          "snippet":
                              news_snippet,

                          "url":
                              news_url,

                          "picture":
                              news_picture,

                          "source":
                              news_source

                      })

                  news_titles = [
                      news["title"]
                      for news in news_items
                      if news["title"]
                  ]

                  sources = sorted(
                      set(
                          news["source"]
                          for news in news_items
                          if news["source"]
                      )
                  )

                  category = classify_category(
                      title,
                      news_titles
                  )

                  trends.append({

                      "title":
                          title,

                      "key":
                          key,

                      "traffic":
                          traffic["label"],

                      "traffic_level":
                          traffic["level"],

                      "traffic_value":
                          traffic["lower_bound"],

                      "description":
                          description,

                      "google_pub_date":
                          pub_date,

                      "picture":
                          picture,

                      "picture_source":
                          picture_source,

                      "news_count":
                          len(news_items),

                      "source_count":
                          len(sources),

                      "sources":
                          sources,

                      "category":
                          category,

                      "news":
                          news_items

                  })

              print(
                  f"{geo}: "
                  f"{len(trends)} trends"
              )

              return trends


          # ============================================================
          # FILE HELPERS
          # ============================================================

          def load_json(
              path,
              default
          ):

              if not path.exists():
                  return default

              try:

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      value = json.load(
                          file
                      )

                  return value

              except Exception as error:

                  print(
                      f"WARNING: could not load "
                      f"{path}: {error}"
                  )

                  return default


          def save_json(
              path,
              value
          ):

              with path.open(
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      value,
                      file,
                      ensure_ascii=False,
                      indent=2
                  )


          # ============================================================
          # HISTORY PATHS
          # ============================================================

          def get_history_file(
              geo,
              date_value
          ):

              if geo == "IT":

                  return (
                      HISTORY_DIR /
                      f"{date_value.strftime('%Y-%m-%d')}.json"
                  )

              return (
                  HISTORY_DIR /
                  f"{geo.lower()}-"
                  f"{date_value.strftime('%Y-%m-%d')}.json"
              )


          def get_state_file(
              geo
          ):

              if geo == "IT":
                  return STATE_FILE

              return (
                  DATA_DIR /
                  f"trends-state-{geo.lower()}.json"
              )


          # ============================================================
          # LOAD HISTORY
          # ============================================================

          def load_recent_history(
              geo
          ):

              recent_snapshots = []

              history_cutoff = (
                  now -
                  timedelta(
                      hours=HISTORY_HOURS
                  )
              )

              for history_file in sorted(
                  HISTORY_DIR.glob("*.json")
              ):

                  if geo == "IT":

                      if re.match(
                          r"^\d{4}-\d{2}-\d{2}\.json$",
                          history_file.name
                      ) is None:
                          continue

                  else:

                      prefix = (
                          geo.lower() +
                          "-"
                      )

                      if not history_file.name.startswith(
                          prefix
                      ):
                          continue

                  data = load_json(
                      history_file,
                      []
                  )

                  if not isinstance(
                      data,
                      list
                  ):
                      continue

                  for snapshot in data:

                      if not isinstance(
                          snapshot,
                          dict
                      ):
                          continue

                      timestamp_raw = snapshot.get(
                          "timestamp"
                      )

                      if not timestamp_raw:
                          continue

                      try:

                          timestamp = datetime.fromisoformat(
                              timestamp_raw
                          )

                      except Exception:

                          continue

                      if timestamp >= history_cutoff:

                          recent_snapshots.append(
                              snapshot
                          )

              recent_snapshots.sort(
                  key=lambda item:
                      item.get(
                          "timestamp",
                          ""
                      )
              )

              return recent_snapshots


          # ============================================================
          # HISTORICAL TREND MATCH
          # ============================================================

          def historical_trend_matches(
              historical_trend,
              key,
              title
          ):

              historical_key = historical_trend.get(
                  "key",
                  ""
              )

              if historical_key == key:
                  return True

              historical_title = historical_trend.get(
                  "title",
                  ""
              )

              if title_matches(
                  historical_title,
                  title
              ):
                  return True

              if (
                  normalize_title(
                      historical_key
                  )
                  ==
                  normalize_title(
                      key
                  )
              ):
                  return True

              return False


          def find_previous(
              recent_snapshots,
              key,
              title,
              minutes
          ):

              target = (
                  now -
                  timedelta(
                      minutes=minutes
                  )
              )

              best = None
              best_delta = None

              for snapshot in recent_snapshots:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue

                  try:

                      timestamp = datetime.fromisoformat(
                          timestamp_raw
                      )

                  except Exception:

                      continue

                  if timestamp > target:
                      continue

                  delta = (
                      target -
                      timestamp
                  )

                  if (
                      best_delta is None
                      or
                      delta < best_delta
                  ):

                      best = snapshot
                      best_delta = delta

              if best is None:
                  return None

              for historical_trend in best.get(
                  "trends",
                  []
              ):

                  if historical_trend_matches(
                      historical_trend,
                      key,
                      title
                  ):

                      return historical_trend

              return None


          # ============================================================
          # OCCURRENCES
          # ============================================================

          def count_recent_occurrences(
              recent_snapshots,
              key,
              title,
              minutes
          ):

              cutoff = (
                  now -
                  timedelta(
                      minutes=minutes
                  )
              )

              count = 0

              for snapshot in recent_snapshots:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue

                  try:

                      timestamp = datetime.fromisoformat(
                          timestamp_raw
                      )

                  except Exception:

                      continue

                  if timestamp < cutoff:
                      continue

                  for trend in snapshot.get(
                      "trends",
                      []
                  ):

                      if historical_trend_matches(
                          trend,
                          key,
                          title
                      ):

                          count += 1
                          break

              return count


          # ============================================================
          # STATE COMPATIBILITY
          # ============================================================

          def find_state_entry(
              state,
              key,
              title
          ):

              if not isinstance(
                  state,
                  dict
              ):
                  return {}, None

              direct = state.get(
                  key
              )

              if isinstance(
                  direct,
                  dict
              ):

                  return direct, key

              normalized_key = normalize_title(
                  key
              )

              for existing_key, value in state.items():

                  if not isinstance(
                      value,
                      dict
                  ):
                      continue

                  existing_title = value.get(
                      "title",
                      ""
                  )

                  if (
                      normalize_title(
                          existing_key
                      )
                      ==
                      normalized_key
                  ):

                      return value, existing_key

                  if title_matches(
                      existing_title,
                      title
                  ):

                      return value, existing_key

              return {}, None


          # ============================================================
          # BAND COMPARISON
          # ============================================================

          def band_change(
              current_level,
              previous
          ):

              if previous is None:
                  return None

              old_level = get_traffic_level(
                  previous
              )

              if old_level <= 0:
                  return None

              return (
                  current_level -
                  old_level
              )


          def band_direction(
              change
          ):

              if change is None:
                  return "UNKNOWN"

              if change > 0:
                  return "UP"

              if change < 0:
                  return "DOWN"

              return "FLAT"


          # ============================================================
          # MOMENTUM
          # ============================================================

          def momentum_value(
              changes
          ):

              valid = [
                  change
                  for change in changes
                  if isinstance(
                      change,
                      int
                  )
                  or isinstance(
                      change,
                      float
                  )
              ]

              if not valid:
                  return 0

              weights = [
                  5,
                  3,
                  1
              ]

              total = 0

              for index, change in enumerate(
                  valid[:3]
              ):

                  total += (
                      change *
                      weights[index]
                  )

              return round(
                  total,
                  2
              )


          def momentum_label(
              value
          ):

              if value >= 10:
                  return "VERY_HIGH"

              if value >= 5:
                  return "HIGH"

              if value > 0:
                  return "POSITIVE"

              if value == 0:
                  return "FLAT"

              if value <= -10:
                  return "VERY_LOW"

              if value <= -5:
                  return "LOW"

              return "NEGATIVE"


          # ============================================================
          # SCORE COMPONENTS
          # ============================================================

          def volume_score(
              traffic_level
          ):

              if traffic_level <= 0:
                  return 0

              score = (
                  math.log10(
                      traffic_level + 1
                  )
                  /
                  math.log10(
                      14
                  )
              ) * 25

              return min(
                  25,
                  round(
                      score,
                      1
                  )
              )


          def acceleration_score(
              changes
          ):

              valid = [
                  change
                  for change in changes
                  if isinstance(
                      change,
                      int
                  )
                  or isinstance(
                      change,
                      float
                  )
              ]

              if not valid:
                  return 0

              positive = [
                  change
                  for change in valid
                  if change > 0
              ]

              if not positive:
                  return 0

              weighted = 0

              weights = [
                  5,
                  4,
                  3,
                  2,
                  1
              ]

              for index, change in enumerate(
                  valid[:5]
              ):

                  if change > 0:

                      weighted += (
                          change *
                          weights[index]
                      )

              score = min(
                  30,
                  weighted * 2.5
              )

              return round(
                  score,
                  1
              )


          def persistence_score(
              appearances
          ):

              return min(
                  15,
                  round(
                      appearances *
                      0.8,
                      1
                  )
              )


          def new_entry_score(
              appearances
          ):

              if appearances <= 1:
                  return 15

              if appearances == 2:
                  return 10

              if appearances <= 4:
                  return 5

              return 0


          def news_score(
              news_count,
              source_count
          ):

              score = (
                  min(
                      6,
                      news_count * 1.5
                  )
                  +
                  min(
                      4,
                      source_count * 2
                  )
              )

              return round(
                  min(
                      10,
                      score
                  ),
                  1
              )


          def recurrence_score(
              occurrences
          ):

              return min(
                  5,
                  round(
                      occurrences *
                      0.5,
                      1
                  )
              )


          # ============================================================
          # PROCESS ONE MARKET
          # ============================================================

          def process_market(
              geo,
              trends,
              state
          ):

              recent_snapshots = load_recent_history(
                  geo
              )

              enriched_trends = []

              for trend in trends:

                  key = trend["key"]
                  title = trend["title"]

                  previous_state, state_key = find_state_entry(
                      state,
                      key,
                      title
                  )

                  if not previous_state:
                      previous_state = {}

                  first_seen = (
                      previous_state.get(
                          "first_seen"
                      )
                      or
                      now_iso
                  )

                  appearances = safe_int(
                      previous_state.get(
                          "appearances",
                          0
                      )
                  ) + 1

                  previous_30m = find_previous(
                      recent_snapshots,
                      key,
                      title,
                      30
                  )

                  previous_1h = find_previous(
                      recent_snapshots,
                      key,
                      title,
                      60
                  )

                  previous_3h = find_previous(
                      recent_snapshots,
                      key,
                      title,
                      180
                  )

                  previous_6h = find_previous(
                      recent_snapshots,
                      key,
                      title,
                      360
                  )

                  previous_24h = find_previous(
                      recent_snapshots,
                      key,
                      title,
                      1440
                  )

                  change_30m = band_change(
                      trend["traffic_level"],
                      previous_30m
                  )

                  change_1h = band_change(
                      trend["traffic_level"],
                      previous_1h
                  )

                  change_3h = band_change(
                      trend["traffic_level"],
                      previous_3h
                  )

                  change_6h = band_change(
                      trend["traffic_level"],
                      previous_6h
                  )

                  change_24h = band_change(
                      trend["traffic_level"],
                      previous_24h
                  )

                  changes = [
                      change_30m,
                      change_1h,
                      change_3h,
                      change_6h,
                      change_24h
                  ]

                  occurrences_1h = count_recent_occurrences(
                      recent_snapshots,
                      key,
                      title,
                      60
                  )

                  occurrences_3h = count_recent_occurrences(
                      recent_snapshots,
                      key,
                      title,
                      180
                  )

                  occurrences_6h = count_recent_occurrences(
                      recent_snapshots,
                      key,
                      title,
                      360
                  )

                  try:

                      first_seen_dt = datetime.fromisoformat(
                          first_seen
                      )

                      duration_seconds = max(
                          0,
                          int(
                              (
                                  now -
                                  first_seen_dt
                              ).total_seconds()
                          )
                      )

                  except Exception:

                      duration_seconds = 0

                  duration_minutes = (
                      duration_seconds //
                      60
                  )

                  # ----------------------------------------------------
                  # MOMENTUM
                  # ----------------------------------------------------

                  momentum_30m = (
                      change_30m
                      if change_30m is not None
                      else 0
                  )

                  momentum_1h = momentum_value([
                      change_30m,
                      change_1h
                  ])

                  momentum_3h = momentum_value([
                      change_30m,
                      change_1h,
                      change_3h
                  ])

                  momentum = momentum_3h

                  momentum_status = momentum_label(
                      momentum
                  )

                  # ----------------------------------------------------
                  # SCORE
                  # ----------------------------------------------------

                  score = (

                      volume_score(
                          trend["traffic_level"]
                      )

                      +

                      acceleration_score(
                          changes
                      )

                      +

                      persistence_score(
                          appearances
                      )

                      +

                      new_entry_score(
                          appearances
                      )

                      +

                      news_score(
                          trend["news_count"],
                          trend["source_count"]
                      )

                      +

                      recurrence_score(
                          occurrences_1h
                      )

                  )

                  score = min(
                      100,
                      round(
                          score,
                          1
                      )
                  )

                  # ----------------------------------------------------
                  # ACCELERATION
                  # ----------------------------------------------------

                  acceleration = "NONE"

                  positive_short = (
                      change_30m is not None
                      and
                      change_30m > 0
                  )

                  positive_medium = (
                      change_1h is not None
                      and
                      change_1h > 0
                  )

                  positive_long = (
                      change_3h is not None
                      and
                      change_3h > 0
                  )

                  if (
                      change_30m is not None
                      and
                      change_1h is not None
                      and
                      change_30m >= 2
                      and
                      change_1h >= 2
                  ):

                      acceleration = "STRONG"

                  elif (
                      positive_short
                      and
                      positive_medium
                  ):

                      acceleration = "MEDIUM"

                  elif (
                      positive_medium
                      or
                      positive_long
                  ):

                      acceleration = "WEAK"

                  # ----------------------------------------------------
                  # STATUS
                  # ----------------------------------------------------

                  status = "HOT"

                  if (
                      appearances <= 1
                      and
                      (
                          trend["traffic_level"] >= 2
                          or
                          trend["news_count"] >= 2
                      )
                  ):

                      status = "EMERGING"

                  elif (
                      acceleration == "STRONG"
                      and
                      (
                          appearances >= 2
                          or
                          trend["traffic_level"] >= 3
                      )
                  ):

                      status = "ACCELERATING"

                  elif (
                      acceleration in [
                          "MEDIUM",
                          "STRONG"
                      ]
                      and
                      (
                          occurrences_1h >= 2
                          or
                          trend["traffic_level"] >= 3
                      )
                  ):

                      status = "RISING"

                  elif (
                      change_6h is not None
                      and
                      change_6h <= -2
                      and
                      trend["traffic_level"] <= 3
                  ):

                      status = "COOLING"

                  elif (
                      appearances >= 4
                      and
                      all(
                          change is None
                          or
                          change == 0
                          for change in [
                              change_1h,
                              change_3h
                          ]
                      )
                  ):

                      status = "STABLE"

                  else:

                      status = "HOT"

                  # ----------------------------------------------------
                  # STATE
                  # ----------------------------------------------------

                  state[key] = {

                      "title":
                          trend["title"],

                      "normalized_title":
                          key,

                      "first_seen":
                          first_seen,

                      "last_seen":
                          now_iso,

                      "appearances":
                          appearances,

                      "last_traffic":
                          trend["traffic"],

                      "last_traffic_level":
                          trend["traffic_level"],

                      "last_traffic_value":
                          trend["traffic_value"],

                      "category":
                          trend["category"],

                      "status":
                          status,

                      "acceleration":
                          acceleration,

                      "score":
                          score,

                      "momentum":
                          momentum

                  }

                  # ----------------------------------------------------
                  # OUTPUT
                  # ----------------------------------------------------

                  enriched_trends.append({

                      "title":
                          trend["title"],

                      "key":
                          key,

                      "normalized_title":
                          key,

                      "category":
                          trend["category"],

                      "status":
                          status,

                      "acceleration":
                          acceleration,

                      "score":
                          score,

                      "traffic":
                          trend["traffic"],

                      "traffic_level":
                          trend["traffic_level"],

                      "traffic_value":
                          trend["traffic_value"],

                      "first_seen":
                          first_seen,

                      "last_seen":
                          now_iso,

                      "appearances":
                          appearances,

                      "duration_minutes":
                          duration_minutes,

                      "momentum":
                          momentum,

                      "momentum_30m":
                          momentum_30m,

                      "momentum_1h":
                          momentum_1h,

                      "momentum_3h":
                          momentum_3h,

                      "momentum_status":
                          momentum_status,

                      "change_30m_bands":
                          change_30m,

                      "change_1h_bands":
                          change_1h,

                      "change_3h_bands":
                          change_3h,

                      "change_6h_bands":
                          change_6h,

                      "change_24h_bands":
                          change_24h,

                      "direction_30m":
                          band_direction(
                              change_30m
                          ),

                      "direction_1h":
                          band_direction(
                              change_1h
                          ),

                      "direction_3h":
                          band_direction(
                              change_3h
                          ),

                      "occurrences_1h":
                          occurrences_1h,

                      "occurrences_3h":
                          occurrences_3h,

                      "occurrences_6h":
                          occurrences_6h,

                      "news_count":
                          trend["news_count"],

                      "source_count":
                          trend["source_count"],

                      "sources":
                          trend["sources"],

                      "picture":
                          trend["picture"],

                      "picture_source":
                          trend["picture_source"],

                      "news":
                          trend["news"]

                  })

              enriched_trends.sort(

                  key=lambda item: (

                      -float(
                          item.get(
                              "score",
                              0
                          )
                      ),

                      -int(
                          item.get(
                              "traffic_level",
                              0
                          )
                      )

                  )

              )

              for index, trend in enumerate(
                  enriched_trends,
                  start=1
              ):

                  trend["rank"] = index

              return enriched_trends


          # ============================================================
          # SAVE MARKET HISTORY
          # ============================================================

          def save_market_history(
              geo,
              trends
          ):

              history_file = get_history_file(
                  geo,
                  now
              )

              day_history = load_json(
                  history_file,
                  []
              )

              if not isinstance(
                  day_history,
                  list
              ):
                  day_history = []

              compact_snapshot = {

                  "timestamp":
                      now_iso,

                  "geo":
                      geo,

                  "trends": [

                      {

                          "key":
                              trend["key"],

                          "title":
                              trend["title"],

                          "traffic":
                              trend["traffic"],

                          "traffic_level":
                              trend["traffic_level"],

                          "traffic_value":
                              trend["traffic_value"]

                      }

                      for trend in trends

                  ]

              }

              day_history.append(
                  compact_snapshot
              )

              history_cutoff = (
                  now -
                  timedelta(
                      hours=HISTORY_HOURS
                  )
              )

              cleaned_history = []

              for snapshot in day_history:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue

                  try:

                      snapshot_time = datetime.fromisoformat(
                          timestamp_raw
                      )

                  except Exception:

                      continue

                  if snapshot_time >= history_cutoff:

                      cleaned_history.append(
                          snapshot
                      )

              cleaned_history.sort(
                  key=lambda item:
                      item.get(
                          "timestamp",
                          ""
                      )
              )

              save_json(
                  history_file,
                  cleaned_history
              )

              return history_file


          # ============================================================
          # CLEAN OLD HISTORY
          # ============================================================

          def cleanup_history():

              history_date_cutoff = (
                  now.date()
                  -
                  timedelta(
                      days=4
                  )
              )

              for old_file in HISTORY_DIR.glob(
                  "*.json"
              ):

                  match = re.search(
                      r"(\d{4}-\d{2}-\d{2})\.json$",
                      old_file.name
                  )

                  if not match:
                      continue

                  try:

                      file_date = datetime.strptime(
                          match.group(1),
                          "%Y-%m-%d"
                      ).date()

                  except Exception:

                      continue

                  if file_date < history_date_cutoff:

                      print(
                          f"Deleting old history: "
                          f"{old_file}"
                      )

                      old_file.unlink()


          # ============================================================
          # CLEAN STATE
          # ============================================================

          def cleanup_state(
              state
          ):

              state_cutoff = (
                  now -
                  timedelta(
                      days=STATE_RETENTION_DAYS
                  )
              )

              stale_keys = []

              for key, item in state.items():

                  if not isinstance(
                      item,
                      dict
                  ):

                      stale_keys.append(
                          key
                      )

                      continue

                  last_seen_raw = item.get(
                      "last_seen"
                  )

                  if not last_seen_raw:

                      stale_keys.append(
                          key
                      )

                      continue

                  try:

                      last_seen = datetime.fromisoformat(
                          last_seen_raw
                      )

                  except Exception:

                      stale_keys.append(
                          key
                      )

                      continue

                  if last_seen < state_cutoff:

                      stale_keys.append(
                          key
                      )

              for key in stale_keys:

                  del state[key]

              return state


          # ============================================================
          # COLLECT ALL MARKETS
          # ============================================================

          market_raw = {}

          for geo, config in MARKETS.items():

              market_raw[geo] = fetch_rss(
                  geo,
                  config["url"]
              )

          print("")
          print("========================================")
          print("MARKET COLLECTION COMPLETE")
          print("========================================")

          for geo, trends in market_raw.items():

              print(
                  f"{geo}: "
                  f"{len(trends)} trends"
              )


          # ============================================================
          # PROCESS MARKETS
          # ============================================================

          market_results = {}

          market_states = {}

          for geo, trends in market_raw.items():

              state_file = get_state_file(
                  geo
              )

              state = load_json(
                  state_file,
                  {}
              )

              if not isinstance(
                  state,
                  dict
              ):
                  state = {}

              enriched = process_market(
                  geo,
                  trends,
                  state
              )

              state = cleanup_state(
                  state
              )

              save_json(
                  state_file,
                  state
              )

              save_market_history(
                  geo,
                  trends
              )

              market_results[geo] = enriched
              market_states[geo] = state


          # ============================================================
          # ITALY V2 COMPATIBILITY
          #
          # latest.json keeps the original V2:
          #
          # trends = Italy trends
          #
          # New global fields are added around it.
          # ============================================================

          italy_trends = market_results.get(
              "IT",
              []
          )


          # ============================================================
          # GLOBAL TREND MATCHING
          # ============================================================

          global_candidates = {}


          for geo, trends in market_results.items():

              for trend in trends:

                  key = normalize_title(
                      trend["title"]
                  )

                  if not key:
                      continue

                  if key not in global_candidates:

                      global_candidates[key] = {

                          "title":
                              trend["title"],

                          "markets": {},

                          "market_count":
                              0

                      }

                  global_candidates[key][
                      "markets"
                  ][geo] = trend


          # ============================================================
          # GLOBAL SCORE
          # ============================================================

          def calculate_global_score(
              markets
          ):

              if not markets:
                  return 0

              market_scores = []

              traffic_levels = []

              active_markets = 0
              accelerating_markets = 0
              rising_markets = 0

              for geo, trend in markets.items():

                  score = safe_float(
                      trend.get(
                          "score",
                          0
                      )
                  )

                  market_scores.append(
                      score
                  )

                  traffic_levels.append(
                      safe_int(
                          trend.get(
                              "traffic_level",
                              0
                          )
                      )
                  )

                  active_markets += 1

                  if trend.get(
                      "status"
                  ) == "ACCELERATING":

                      accelerating_markets += 1

                  elif trend.get(
                      "status"
                  ) == "RISING":

                      rising_markets += 1

              base = (
                  max(
                      market_scores
                  )
                  if market_scores
                  else 0
              )

              average = (
                  sum(
                      market_scores
                  )
                  /
                  len(
                      market_scores
                  )
              )

              diversity_bonus = min(
                  15,
                  active_markets * 3
              )

              acceleration_bonus = min(
                  10,
                  accelerating_markets * 5
              )

              rising_bonus = min(
                  5,
                  rising_markets * 2
              )

              score = (
                  base * 0.60
                  +
                  average * 0.20
                  +
                  diversity_bonus
                  +
                  acceleration_bonus
                  +
                  rising_bonus
              )

              return min(
                  100,
                  round(
                      score,
                      1
                  )
              )


          # ============================================================
          # GLOBAL STATUS
          # ============================================================

          def global_status(
              markets,
              global_score
          ):

              statuses = [
                  trend.get(
                      "status"
                  )
                  for trend in markets.values()
              ]

              if (
                  "ACCELERATING"
                  in statuses
                  and
                  len(markets) >= 2
              ):

                  return "ACCELERATING"

              if (
                  "RISING"
                  in statuses
                  and
                  len(markets) >= 2
              ):

                  return "RISING"

              if global_score >= 80:
                  return "HOT"

              if global_score >= 60:
                  return "ACTIVE"

              return "STABLE"


          # ============================================================
          # ITALY LOOKUP
          # ============================================================

          italy_lookup = {}

          for trend in italy_trends:

              italy_lookup[
                  normalize_title(
                      trend["title"]
                  )
              ] = trend


          # ============================================================
          # GLOBAL RADAR
          # ============================================================

          global_trends = []

          for key, candidate in global_candidates.items():

              markets = candidate[
                  "markets"
              ]

              global_score = calculate_global_score(
                  markets
              )

              status = global_status(
                  markets,
                  global_score
              )

              italy = italy_lookup.get(
                  key
              )

              italy_score = (
                  safe_float(
                      italy.get(
                          "score",
                          0
                      )
                  )
                  if italy
                  else 0
              )

              italy_status = (
                  italy.get(
                      "status"
                  )
                  if italy
                  else "NOT_PRESENT"
              )

              italy_momentum = (
                  safe_float(
                      italy.get(
                          "momentum_3h",
                          0
                      )
                  )
                  if italy
                  else 0
              )

              # --------------------------------------------------------
              # CROSSOVER
              #
              # Strong global presence + Italian presence/growth.
              # --------------------------------------------------------

              global_presence = min(
                  100,
                  len(markets) * 20
              )

              global_strength = (
                  global_score
              )

              italy_strength = (
                  italy_score
              )

              italy_growth_bonus = 0

              if italy:

                  if italy.get(
                      "status"
                  ) == "ACCELERATING":

                      italy_growth_bonus = 20

                  elif italy.get(
                      "status"
                  ) == "RISING":

                      italy_growth_bonus = 12

                  elif italy.get(
                      "acceleration"
                  ) in [
                      "MEDIUM",
                      "STRONG"
                  ]:

                      italy_growth_bonus = 8

              crossover_score = min(
                  100,
                  round(
                      (
                          global_strength * 0.45
                          +
                          italy_strength * 0.30
                          +
                          global_presence * 0.15
                          +
                          italy_growth_bonus
                      ),
                      1
                  )
              )

              # --------------------------------------------------------
              # OPPORTUNITY
              #
              # Deliberately separate from Google traffic.
              # --------------------------------------------------------

              momentum_bonus = min(
                  15,
                  max(
                      0,
                      italy_momentum * 2
                  )
              )

              opportunity_score = min(
                  100,
                  round(
                      (
                          global_score * 0.35
                          +
                          italy_score * 0.30
                          +
                          crossover_score * 0.20
                          +
                          momentum_bonus
                          +
                          min(
                              15,
                              len(markets) * 3
                          )
                      ),
                      1
                  )
              )

              market_summary = {}

              for geo, trend in markets.items():

                  market_summary[geo] = {

                      "title":
                          trend["title"],

                      "score":
                          trend["score"],

                      "status":
                          trend["status"],

                      "acceleration":
                          trend["acceleration"],

                      "traffic":
                          trend["traffic"],

                      "traffic_level":
                          trend["traffic_level"],

                      "momentum":
                          trend.get(
                              "momentum_3h",
                              0
                          ),

                      "news_count":
                          trend.get(
                              "news_count",
                              0
                          )

                  }

              global_trends.append({

                  "title":
                      candidate["title"],

                  "key":
                      key,

                  "global_score":
                      global_score,

                  "italy_score":
                      italy_score,

                  "crossover_score":
                      crossover_score,

                  "opportunity_score":
                      opportunity_score,

                  "global_status":
                      status,

                  "italy_status":
                      italy_status,

                  "markets":
                      market_summary,

                  "market_count":
                      len(markets),

                  "market_codes":
                      sorted(
                          markets.keys()
                      )

              })


          # ============================================================
          # GLOBAL SORT
          # ============================================================

          global_trends.sort(

              key=lambda item: (

                  -float(
                      item.get(
                          "opportunity_score",
                          0
                      )
                  ),

                  -float(
                      item.get(
                          "global_score",
                          0
                      )
                  ),

                  -int(
                      item.get(
                          "market_count",
                          0
                      )
                  )

              )

          )


          for index, trend in enumerate(
              global_trends,
              start=1
          ):

              trend["rank"] = index


          # ============================================================
          # CROSSOVER-ONLY RADAR
          # ============================================================

          crossover_trends = []

          for trend in global_trends:

              if (
                  trend["market_count"] >= 2
                  and
                  trend["italy_status"]
                  !=
                  "NOT_PRESENT"
              ):

                  crossover_trends.append(
                      trend
                  )

          crossover_trends.sort(

              key=lambda item:
                  -float(
                      item.get(
                          "crossover_score",
                          0
                      )
                  )

          )


          # ============================================================
          # GLOBAL MARKET SUMMARY
          # ============================================================

          market_summary = {}

          for geo, trends in market_results.items():

              market_summary[geo] = {

                  "name":
                      MARKETS[geo]["name"],

                  "flag":
                      MARKETS[geo]["flag"],

                  "trend_count":
                      len(trends),

                  "top_trends": [

                      {

                          "title":
                              trend["title"],

                          "score":
                              trend["score"],

                          "status":
                              trend["status"],

                          "traffic":
                              trend["traffic"]

                      }

                      for trend in trends[:10]

                  ]

              }


          # ============================================================
          # LATEST JSON
          #
          # Existing V2 Italy fields are preserved.
          # ============================================================

          latest = {

              "version":
                  "2.1",

              "timestamp":
                  now_iso,

              "source":
                  "Google Trends RSS",

              "geo":
                  "IT",

              "feed_url":
                  MARKETS["IT"]["url"],

              "history_hours":
                  HISTORY_HOURS,

              "trend_count":
                  len(
                      italy_trends
                  ),

              "scoring": {

                  "volume":
                      25,

                  "acceleration":
                      30,

                  "persistence":
                      15,

                  "new_entry":
                      15,

                  "news_sources":
                      10,

                  "recent_recurrence":
                      5

              },

              "traffic_note":
                  "Google Trends RSS traffic values are approximate bands.",

              "trends":
                  italy_trends,

              # --------------------------------------------------------
              # NEW V2.1
              # --------------------------------------------------------

              "radar": {

                  "version":
                      "2.1",

                  "markets":
                      list(
                          MARKETS.keys()
                      ),

                  "market_count":
                      len(
                          MARKETS
                      ),

                  "global_trend_count":
                      len(
                          global_trends
                      ),

                  "crossover_count":
                      len(
                          crossover_trends
                      )

              },

              "markets":
                  market_summary,

              "global_trends":
                  global_trends[:100],

              "crossover_trends":
                  crossover_trends[:50],

              "global_scoring": {

                  "market_strength":
                      60,

                  "market_average":
                      20,

                  "market_diversity":
                      15,

                  "acceleration_bonus":
                      10,

                  "rising_bonus":
                      5

              },

              "opportunity_note":
                  "Opportunity Score is a ShortPrompt composite metric based on cross-market strength, Italy strength, crossover and momentum. It is not a Google metric."

          }


          # ============================================================
          # SAVE LATEST
          # ============================================================

          save_json(
              LATEST_FILE,
              latest
          )


          # ============================================================
          # SAVE / PRESERVE ITALY STATE
          # ============================================================

          italy_state = market_states.get(
              "IT",
              {}
          )

          save_json(
              STATE_FILE,
              italy_state
          )


          # ============================================================
          # GLOBAL STATE
          # ============================================================

          global_state = load_json(
              GLOBAL_STATE_FILE,
              {}
          )

          if not isinstance(
              global_state,
              dict
          ):

              global_state = {}


          for trend in global_trends:

              key = trend["key"]

              old = global_state.get(
                  key,
                  {}
              )

              if not isinstance(
                  old,
                  dict
              ):

                  old = {}

              first_seen = (
                  old.get(
                      "first_seen"
                  )
                  or
                  now_iso
              )

              appearances = (
                  safe_int(
                      old.get(
                          "appearances",
                          0
                      )
                  )
                  + 1
              )

              global_state[key] = {

                  "title":
                      trend["title"],

                  "first_seen":
                      first_seen,

                  "last_seen":
                      now_iso,

                  "appearances":
                      appearances,

                  "global_score":
                      trend["global_score"],

                  "italy_score":
                      trend["italy_score"],

                  "crossover_score":
                      trend["crossover_score"],

                  "opportunity_score":
                      trend["opportunity_score"],

                  "market_count":
                      trend["market_count"],

                  "market_codes":
                      trend["market_codes"],

                  "global_status":
                      trend["global_status"],

                  "italy_status":
                      trend["italy_status"]

              }


          global_state = cleanup_state(
              global_state
          )

          save_json(
              GLOBAL_STATE_FILE,
              global_state
          )


          # ============================================================
          # CLEAN OLD HISTORY
          # ============================================================

          cleanup_history()


          # ============================================================
          # VALIDATION DATA
          # ============================================================

          print("")
          print("========================================")
          print("TREND RADAR V2.1 RESULT")
          print("========================================")
          print("")

          print(
              "ITALY TOP 10:"
          )

          for trend in italy_trends[:10]:

              print(

                  f"{trend['rank']:02d}. "

                  f"{trend['title']} | "

                  f"{trend['status']} | "

                  f"{trend['acceleration']} | "

                  f"{trend['score']}/100 | "

                  f"{trend['traffic']} | "

                  f"M:{trend['momentum_3h']}"

              )

          print("")

          print(
              "GLOBAL TOP 20:"
          )

          for trend in global_trends[:20]:

              print(

                  f"{trend['rank']:02d}. "

                  f"{trend['title']} | "

                  f"GLOBAL {trend['global_score']} | "

                  f"IT {trend['italy_score']} | "

                  f"CROSS {trend['crossover_score']} | "

                  f"OPP {trend['opportunity_score']} | "

                  f"{','.join(trend['market_codes'])}"

              )

          print("")

          print(
              "CROSSOVER TOP 10:"
          )

          for index, trend in enumerate(
              crossover_trends[:10],
              start=1
          ):

              print(

                  f"{index:02d}. "

                  f"{trend['title']} | "

                  f"GLOBAL {trend['global_score']} | "

                  f"ITALIA {trend['italy_score']} | "

                  f"CROSS {trend['crossover_score']} | "

                  f"OPP {trend['opportunity_score']}"

              )

          print("")
          print("Generated files:")
          print(f"- {LATEST_FILE}")
          print(f"- {STATE_FILE}")
          print(f"- {GLOBAL_STATE_FILE}")
          print(f"- {HISTORY_DIR}")
          print("")

          PY

      - name: Validate generated JSON
        run: |
          python3 <<'PY'

          import json
          from pathlib import Path

          required_files = [

              Path(
                  "data/latest.json"
              ),

              Path(
                  "data/trends-state.json"
              ),

              Path(
                  "data/global-state.json"
              )

          ]

          for file in required_files:

              if not file.exists():

                  raise SystemExit(
                      f"Missing file: {file}"
                  )

              with file.open(
                  "r",
                  encoding="utf-8"
              ) as handle:

                  data = json.load(
                      handle
                  )

              if not isinstance(
                  data,
                  (dict, list)
              ):

                  raise SystemExit(
                      f"Invalid JSON structure: {file}"
                  )

              print(
                  f"Valid JSON: {file}"
              )


          latest = json.loads(
              Path(
                  "data/latest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          # ------------------------------------------------------------
          # BASIC V2.1 VALIDATION
          # ------------------------------------------------------------

          if latest.get(
              "version"
          ) != "2.1":

              raise SystemExit(
                  "Invalid Trend Radar version."
              )


          if "trends" not in latest:

              raise SystemExit(
                  "Missing Italy trends."
              )


          if "global_trends" not in latest:

              raise SystemExit(
                  "Missing global trends."
              )


          if "crossover_trends" not in latest:

              raise SystemExit(
                  "Missing crossover trends."
              )


          if "markets" not in latest:

              raise SystemExit(
                  "Missing market data."
              )


          expected_markets = [
              "IT",
              "US",
              "GB",
              "DE",
              "FR",
              "ES"
          ]


          for geo in expected_markets:

              if geo not in latest["markets"]:

                  raise SystemExit(
                      f"Missing market: {geo}"
                  )


          # ------------------------------------------------------------
          # HISTORY VALIDATION
          # ------------------------------------------------------------

          history_files = list(
              Path(
                  "data/history"
              ).glob(
                  "*.json"
              )
          )

          print(
              f"History files: "
              f"{len(history_files)}"
          )


          for file in history_files:

              with file.open(
                  "r",
                  encoding="utf-8"
              ) as handle:

                  json.load(
                      handle
                  )

              print(
                  f"Valid JSON: {file}"
              )


          print("")
          print(
              "All Trend Radar V2.1 JSON files "
              "are valid."
          )

          PY

