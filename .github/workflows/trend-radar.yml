                  "spotify",
                  "honor",
                  "technology",
                  "tech"
              ],

              "Sport": [
                  "calcio",
                  "football",
                  "soccer",
                  "serie a",
                  "serie b",
                  "serie c",
                  "champions",
                  "europa league",
                  "conference league",
                  "mondiali",
                  "world cup",
                  "formula 1",
                  "f1",
                  "motogp",
                  "tennis",
                  "basket",
                  "nba",
                  "atp",
                  "wta",
