name: ShortPrompt Trend Radar V3

on:
  schedule:
    # Ogni 15 minuti, evitando esattamente lo scatto dell'ora
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Collect Google Trends
        shell: python
        run: |
          import os
          import re
          import json
          import math
          import hashlib
          import unicodedata
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          # ============================================================
          # CONFIG
          # ============================================================

          DATA_DIR = Path("data")
          HISTORY_DIR = DATA_DIR / "history"
          DATA_DIR.mkdir(parents=True, exist_ok=True)
          HISTORY_DIR.mkdir(parents=True, exist_ok=True)

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()

          # Manteniamo 72 ore di storico dettagliato
          HISTORY_HOURS = 72

          # Stato persistente massimo 14 giorni
          STATE_DAYS = 14

          # Paesi monitorati
          MARKETS = {
              "IT": {
                  "name": "Italia",
                  "geo": "IT",
                  "weight": 1.00
              },
              "US": {
                  "name": "USA",
                  "geo": "US",
                  "weight": 1.00
              },
              "GB": {
                  "name": "UK",
                  "geo": "GB",
                  "weight": 0.90
              },
              "DE": {
                  "name": "Germania",
                  "geo": "DE",
                  "weight": 0.90
              },
              "FR": {
                  "name": "Francia",
                  "geo": "FR",
                  "weight": 0.90
              },
              "ES": {
                  "name": "Spagna",
                  "geo": "ES",
                  "weight": 0.85
              }
          }

          # ============================================================
          # GOOGLE TRENDS RSS
          # ============================================================

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; ShortPromptTrendRadar/3.0; "
                  "+https://shortprompt.altervista.org)"
              ),
              "Accept": "application/rss+xml, application/xml, text/xml"
          }

          def fetch_rss(geo):
              url = (
                  "https://trends.google.com/trending/rss?"
                  + urllib.parse.urlencode({"geo": geo})
              )

              req = urllib.request.Request(url, headers=HEADERS)

              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()

              return raw

          # ============================================================
          # HELPERS
          # ============================================================

          def clean_text(value):
              if value is None:
                  return ""

              value = str(value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def normalize_title(title):
              """
              Normalizzazione forte per evitare che:
                genoa frosinone
                genoa - frosinone
                genoa–frosinone
                genoa — frosinone

              vengano considerati trend differenti.
              """

              value = clean_text(title).lower()

              # Unicode normalization
              value = unicodedata.normalize("NFKD", value)

              # Rimuove accenti
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              # Dash e separatori diventano spazio
              value = re.sub(r"[-–—−_/|]+", " ", value)

              # Apostrofi
              value = re.sub(r"[’'`]", "", value)

              # Tutta la punteggiatura -> spazio
              value = re.sub(r"[^\w\s]", " ", value)

              # Spazi multipli
              value = re.sub(r"\s+", " ", value)

              return value.strip()

          def make_id(title):
              normalized = normalize_title(title)

              return hashlib.sha1(
                  normalized.encode("utf-8")
              ).hexdigest()[:16]

          def parse_traffic(value):
              """
              Google Trends RSS restituisce valori come:
                100+
                200+
                500+
                1000+
                5000+
                10000+

              Non li interpretiamo come numeri precisi.
              Sono fasce.
              """

              if not value:
                  return {
                      "raw": "0",
                      "level": 0,
                      "value": 0
                  }

              raw = clean_text(value).replace(",", "")

              match = re.search(r"(\d+)", raw)

              if not match:
                  return {
                      "raw": raw,
                      "level": 0,
                      "value": 0
                  }

              number = int(match.group(1))

              thresholds = [
                  100,
                  200,
                  500,
                  1000,
                  2000,
                  5000,
                  10000,
                  20000,
                  50000,
                  100000,
                  200000,
                  500000,
                  1000000
              ]

              level = 0

              for threshold in thresholds:
                  if number >= threshold:
                      level += 1

              return {
                  "raw": raw,
                  "level": level,
                  "value": number
              }

          def level_change(current, previous):
              if previous is None:
                  return 0

              return current - previous

          def direction(change):
              if change >= 2:
                  return "STRONG_UP"

              if change == 1:
                  return "UP"

              if change == 0:
                  return "FLAT"

              if change == -1:
                  return "DOWN"

              return "STRONG_DOWN"

          def clamp(value, minimum=0, maximum=100):
              return max(minimum, min(maximum, int(round(value))))

          # ============================================================
          # XML PARSER
          # ============================================================

          NS_HT = "https://trends.google.com/trending/rss"

          def parse_feed(raw, market):
              root = ET.fromstring(raw)

              trends = []

              for item in root.findall(".//item"):

                  title = clean_text(
                      item.findtext("title")
                  )

                  if not title:
                      continue

                  traffic_raw = clean_text(
                      item.findtext(
                          f"{{{NS_HT}}}approx_traffic"
                      )
                  )

                  traffic = parse_traffic(traffic_raw)

                  pub_date = clean_text(
                      item.findtext("pubDate")
                  )

                  link = clean_text(
                      item.findtext("link")
                  )

                  picture = clean_text(
                      item.findtext(
                          f"{{{NS_HT}}}picture"
                      )
                  )

                  picture_source = clean_text(
                      item.findtext(
                          f"{{{NS_HT}}}picture_source"
                      )
                  )

                  news_items = []

                  for news in item.findall(
                      f".//{{{NS_HT}}}news_item"
                  ):

                      news_title = clean_text(
                          news.findtext(
                              f"{{{NS_HT}}}news_item_title"
                          )
                      )

                      news_snippet = clean_text(
                          news.findtext(
                              f"{{{NS_HT}}}news_item_snippet"
                          )
                      )

                      news_url = clean_text(
                          news.findtext(
                              f"{{{NS_HT}}}news_item_url"
                          )
                      )

                      news_source = clean_text(
                          news.findtext(
                              f"{{{NS_HT}}}news_item_source"
                          )
                      )

                      if news_title:
                          news_items.append({
                              "title": news_title,
                              "snippet": news_snippet,
                              "url": news_url,
                              "source": news_source
                          })

                  normalized = normalize_title(title)
                  trend_id = make_id(title)

                  trends.append({
                      "id": trend_id,
                      "title": title,
                      "normalized_title": normalized,
                      "market": market,
                      "market_name": MARKETS[market]["name"],
                      "traffic": traffic,
                      "pub_date": pub_date,
                      "link": link,
                      "picture": picture,
                      "picture_source": picture_source,
                      "news": news_items
                  })

              return trends

          # ============================================================
          # LOAD OLD STATE
          # ============================================================

          state_file = DATA_DIR / "trends-state.json"

          if state_file.exists():
              try:
                  state = json.loads(
                      state_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  state = {}
          else:
              state = {}

          if not isinstance(state, dict):
              state = {}

          # ============================================================
          # COLLECT ALL MARKETS
          # ============================================================

          current_by_market = {}

          errors = []

          for market, config in MARKETS.items():

              try:
                  raw = fetch_rss(config["geo"])

                  parsed = parse_feed(
                      raw,
                      market
                  )

                  current_by_market[market] = parsed

                  print(
                      f"{market}: "
                      f"{len(parsed)} trends"
                  )

              except Exception as exc:

                  errors.append({
                      "market": market,
                      "error": str(exc)
                  })

                  current_by_market[market] = []

                  print(
                      f"ERROR {market}: {exc}"
                  )

          # ============================================================
          # CURRENT SNAPSHOT
          # ============================================================

          snapshot_trends = []

          for market, trends in current_by_market.items():

              for trend in trends:

                  item = dict(trend)

                  item["collected_at"] = NOW_ISO

                  snapshot_trends.append(item)

          snapshot = {
              "version": "3.0",
              "generated_at": NOW_ISO,
              "markets": list(MARKETS.keys()),
              "errors": errors,
              "trends": snapshot_trends
          }

          # ============================================================
          # HISTORY FILE
          # ============================================================

          date_key = NOW.strftime("%Y-%m-%d")
          history_file = HISTORY_DIR / f"{date_key}.json"

          if history_file.exists():

              try:
                  daily_history = json.loads(
                      history_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  daily_history = []

          else:
              daily_history = []

          if not isinstance(daily_history, list):
              daily_history = []

          # Aggiungiamo snapshot compatto
          daily_history.append({
              "timestamp": NOW_ISO,
              "trends": [
                  {
                      "id": t["id"],
                      "title": t["title"],
                      "market": t["market"],
                      "traffic": t["traffic"],
                      "news_count": len(t["news"])
                  }
                  for t in snapshot_trends
              ]
          })

          # Conserviamo soltanto 72 ore
          cutoff = NOW - timedelta(
              hours=HISTORY_HOURS
          )

          filtered_history = []

          for entry in daily_history:

              try:
                  timestamp = datetime.fromisoformat(
                      entry["timestamp"]
                  )

                  if timestamp >= cutoff:
                      filtered_history.append(entry)

              except Exception:
                  pass

          history_file.write_text(
              json.dumps(
                  filtered_history,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ============================================================
          # LOAD HISTORY FROM ALL 72H FILES
          # ============================================================

          history_entries = []

          for file in HISTORY_DIR.glob("*.json"):

              try:
                  entries = json.loads(
                      file.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(entries, list):
                      history_entries.extend(entries)

              except Exception:
                  continue

          history_entries.sort(
              key=lambda x: x.get(
                  "timestamp",
                  ""
              )
          )

          # Only 72 hours
          recent_history = []

          for entry in history_entries:

              try:
                  timestamp = datetime.fromisoformat(
                      entry["timestamp"]
                  )

                  if timestamp >= cutoff:
                      recent_history.append(entry)

              except Exception:
                  pass

          # ============================================================
          # BUILD PER-TREND HISTORY
          # ============================================================

          trend_history = {}

          for entry in recent_history:

              timestamp = entry.get(
                  "timestamp"
              )

              for trend in entry.get(
                  "trends",
                  []
              ):

                  key = (
                      trend.get("market", "")
                      + ":"
                      + trend.get("id", "")
                  )

                  if key not in trend_history:
                      trend_history[key] = []

                  trend_history[key].append({
                      "timestamp": timestamp,
                      "level": trend.get(
                          "traffic",
                          {}
                      ).get(
                          "level",
                          0
                      ),
                      "value": trend.get(
                          "traffic",
                          {}
                      ).get(
                          "value",
                          0
                      )
                  })

          # ============================================================
          # FIND HISTORICAL LEVEL
          # ============================================================

          def nearest_level(history, seconds_back):
              if not history:
                  return None

              target = NOW - timedelta(
                  seconds=seconds_back
              )

              best = None
              best_delta = None

              for point in history:

                  try:
                      ts = datetime.fromisoformat(
                          point["timestamp"]
                      )
                  except Exception:
                      continue

                  delta = abs(
                      (ts - target).total_seconds()
                  )

                  # Max tolerance:
                  # 20 minutes for short windows
                  # 45 minutes for larger windows
                  tolerance = (
                      20 * 60
                      if seconds_back <= 3600
                      else 45 * 60
                  )

                  if delta <= tolerance:

                      if (
                          best_delta is None
                          or delta < best_delta
                      ):
                          best = point
                          best_delta = delta

              return (
                  best["level"]
                  if best is not None
                  else None
              )

          # ============================================================
          # BUILD GLOBAL AGGREGATION
          # ============================================================

          global_groups = {}

          for market, trends in current_by_market.items():

              for trend in trends:

                  trend_id = trend["id"]

                  if trend_id not in global_groups:
                      global_groups[trend_id] = {
                          "id": trend_id,
                          "title": trend["title"],
                          "markets": []
                      }

                  global_groups[trend_id]["markets"].append(
                      market
                  )

          # ============================================================
          # CLASSIFICATION
          # ============================================================

          def classify(
              level,
              change_30m,
              change_1h,
              change_3h,
              change_6h,
              appearances,
              news_count
          ):

              # Nuovo trend
              if (
                  appearances <= 1
                  and (
                      level >= 2
                      or news_count >= 2
                  )
              ):
                  return "EMERGING"

              # Accelerazione forte
              if (
                  change_30m >= 2
                  and change_1h >= 2
              ):
                  return "ACCELERATING"

              # Crescita significativa
              if (
                  (
                      change_30m >= 1
                      and change_1h >= 1
                  )
                  or (
                      change_1h >= 2
                      and change_3h >= 1
                  )
                  or level >= 4
              ):
                  return "RISING"

              # Raffreddamento
              if (
                  change_6h <= -2
                  and level <= 3
              ):
                  return "COOLING"

              # Trend persistente ma stabile
              if (
                  appearances >= 4
                  and abs(change_1h) <= 1
                  and abs(change_3h) <= 1
              ):
                  return "STABLE"

              return "HOT"

          # ============================================================
          # SCORE
          # ============================================================

          def calculate_score(
              level,
              change_30m,
              change_1h,
              change_3h,
              appearances,
              news_count,
              market_count
          ):

              # --------------------------------------------------------
              # VOLUME 25
              # --------------------------------------------------------

              volume_score = min(
                  25,
                  level * 3.5
              )

              # --------------------------------------------------------
              # ACCELERATION 30
              # --------------------------------------------------------

              acceleration_raw = (
                  change_30m * 5
                  + change_1h * 3
                  + change_3h * 1
              )

              acceleration_score = clamp(
                  acceleration_raw,
                  0,
                  30
              )

              # --------------------------------------------------------
              # PERSISTENCE 15
              # --------------------------------------------------------

              persistence_score = min(
                  15,
                  appearances * 2
              )

              # --------------------------------------------------------
              # NEW ENTRY 15
              # --------------------------------------------------------

              if appearances <= 1:
                  new_entry_score = 15

              elif appearances <= 2:
                  new_entry_score = 10

              else:
                  new_entry_score = 4

              # --------------------------------------------------------
              # NEWS + SOURCE DIVERSITY 10
              # --------------------------------------------------------

              news_score = min(
                  10,
                  news_count * 2
                  + max(0, market_count - 1) * 2
              )

              # --------------------------------------------------------
              # RECURRENCE 5
              # --------------------------------------------------------

              recurrence_score = min(
                  5,
                  max(0, appearances // 2)
              )

              total = (
                  volume_score
                  + acceleration_score
                  + persistence_score
                  + new_entry_score
                  + news_score
                  + recurrence_score
              )

              return clamp(total)

          # ============================================================
          # MARKET RESULTS
          # ============================================================

          market_results = {}

          for market, trends in current_by_market.items():

              results = []

              for trend in trends:

                  key = (
                      market
                      + ":"
                      + trend["id"]
                  )

                  history = trend_history.get(
                      key,
                      []
                  )

                  level = trend[
                      "traffic"
                  ]["level"]

                  change_30m = level_change(
                      level,
                      nearest_level(
                          history,
                          30 * 60
                      )
                  )

                  change_1h = level_change(
                      level,
                      nearest_level(
                          history,
                          60 * 60
                      )
                  )

                  change_3h = level_change(
                      level,
                      nearest_level(
                          history,
                          3 * 60 * 60
                      )
                  )

                  change_6h = level_change(
                      level,
                      nearest_level(
                          history,
                          6 * 60 * 60
                      )
                  )

                  appearances = len(history)

                  # Numero di news attuali
                  news_count = len(
                      trend.get(
                          "news",
                          []
                      )
                  )

                  status = classify(
                      level,
                      change_30m,
                      change_1h,
                      change_3h,
                      change_6h,
                      appearances,
                      news_count
                  )

                  score = calculate_score(
                      level,
                      change_30m,
                      change_1h,
                      change_3h,
                      appearances,
                      news_count,
                      1
                  )

                  results.append({
                      **trend,
                      "score": score,
                      "status": status,
                      "duration_snapshots": appearances,
                      "change_30m_bands": change_30m,
                      "change_1h_bands": change_1h,
                      "change_3h_bands": change_3h,
                      "change_6h_bands": change_6h,
                      "momentum_30m": direction(
                          change_30m
                      ),
                      "momentum_1h": direction(
                          change_1h
                      ),
                      "momentum_3h": direction(
                          change_3h
                      )
                  })

              results.sort(
                  key=lambda x: (
                      x["score"],
                      x["traffic"]["level"]
                  ),
                  reverse=True
              )

              for index, result in enumerate(
                  results,
                  start=1
              ):
                  result["rank"] = index

              market_results[market] = results

          # ============================================================
          # GLOBAL RADAR
          # ============================================================

          global_results = []

          for trend_id, group in global_groups.items():

              title = group["title"]
              markets = group["markets"]

              # Prendiamo il livello migliore
              levels = []

              news_total = 0

              for market in markets:

                  for trend in current_by_market.get(
                      market,
                      []
                  ):

                      if trend["id"] == trend_id:

                          levels.append(
                              trend["traffic"]["level"]
                          )

                          news_total += len(
                              trend.get(
                                  "news",
                                  []
                              )
                          )

              if not levels:
                  continue

              best_level = max(levels)

              # Costruiamo una storia globale
              global_history = []

              for entry in recent_history:

                  matching = [
                      t for t in entry.get(
                          "trends",
                          []
                      )
                      if t.get("id") == trend_id
                  ]

                  if not matching:
                      continue

                  max_level = max(
                      t.get(
                          "traffic",
                          {}
                      ).get(
                          "level",
                          0
                      )
                      for t in matching
                  )

                  global_history.append({
                      "timestamp": entry[
                          "timestamp"
                      ],
                      "level": max_level
                  })

              change_30m = level_change(
                  best_level,
                  nearest_level(
                      global_history,
                      30 * 60
                  )
              )

              change_1h = level_change(
                  best_level,
                  nearest_level(
                      global_history,
                      60 * 60
                  )
              )

              change_3h = level_change(
                  best_level,
                  nearest_level(
                      global_history,
                      3 * 60 * 60
                  )
              )

              change_6h = level_change(
                  best_level,
                  nearest_level(
                      global_history,
                      6 * 60 * 60
                  )
              )

              appearances = len(
                  global_history
              )

              status = classify(
                  best_level,
                  change_30m,
                  change_1h,
                  change_3h,
                  change_6h,
                  appearances,
                  news_total
              )

              score = calculate_score(
                  best_level,
                  change_30m,
                  change_1h,
                  change_3h,
                  appearances,
                  news_total,
                  len(markets)
              )

              global_results.append({
                  "id": trend_id,
                  "title": title,
                  "score": score,
                  "status": status,
                  "traffic_level": best_level,
                  "markets": markets,
                  "market_count": len(markets),
                  "duration_snapshots": appearances,
                  "change_30m_bands": change_30m,
                  "change_1h_bands": change_1h,
                  "change_3h_bands": change_3h,
                  "change_6h_bands": change_6h,
                  "momentum_30m": direction(
                      change_30m
                  ),
                  "momentum_1h": direction(
                      change_1h
                  ),
                  "momentum_3h": direction(
                      change_3h
                  )
              })

          global_results.sort(
              key=lambda x: (
                  x["score"],
                  x["traffic_level"]
              ),
              reverse=True
          )

          for index, result in enumerate(
              global_results,
              start=1
          ):
              result["rank"] = index

          # ============================================================
          # CROSSOVER GLOBAL -> ITALIA
          # ============================================================

          italy_map = {
              t["id"]: t
              for t in current_by_market.get(
                  "IT",
                  []
              )
          }

          global_map = {
              r["id"]: r
              for r in global_results
          }

          crossover_results = []

          for trend_id, global_trend in global_map.items():

              if trend_id not in italy_map:
                  continue

              italy_trend = italy_map[
                  trend_id
              ]

              italy_result = next(
                  (
                      x
                      for x in market_results.get(
                          "IT",
                          []
                      )
                      if x["id"] == trend_id
                  ),
                  None
              )

              if italy_result is None:
                  continue

              # Non consideriamo crossover se l'Italia
              # è già da tempo stabilmente dominante.
              global_score = global_trend[
                  "score"
              ]

              italy_score = italy_result[
                  "score"
              ]

              # Crossover strength:
              # global momentum + differenza score
              # + presenza multi-market.
              global_momentum = max(
                  0,
                  global_trend[
                      "change_1h_bands"
                  ]
              )

              italy_momentum = max(
                  0,
                  italy_result[
                      "change_1h_bands"
                  ]
              )

              market_bonus = min(
                  20,
                  global_trend[
                      "market_count"
                  ] * 4
              )

              momentum_bonus = min(
                  30,
                  global_momentum * 8
              )

              italy_bonus = min(
                  20,
                  italy_momentum * 6
              )

              gap_bonus = min(
                  30,
                  max(
                      0,
                      global_score
                      - italy_score
                  )
              )

              crossover_score = clamp(
                  market_bonus
                  + momentum_bonus
                  + italy_bonus
                  + gap_bonus
              )

              if crossover_score < 25:
                  crossover_status = "WEAK"

              elif crossover_score < 50:
                  crossover_status = "WATCH"

              elif crossover_score < 75:
                  crossover_status = "STRONG"

              else:
                  crossover_status = "HOT"

              crossover_results.append({
                  "id": trend_id,
                  "title": global_trend[
                      "title"
                  ],
                  "opportunity_score":
                      crossover_score,
                  "crossover_status":
                      crossover_status,
                  "global_score":
                      global_score,
                  "italy_score":
                      italy_score,
                  "global_status":
                      global_trend[
                          "status"
                      ],
                  "italy_status":
                      italy_result[
                          "status"
                      ],
                  "global_markets":
                      global_trend[
                          "markets"
                      ],
                  "global_market_count":
                      global_trend[
                          "market_count"
                      ],
                  "global_momentum_1h":
                      global_trend[
                          "change_1h_bands"
                      ],
                  "italy_momentum_1h":
                      italy_result[
                          "change_1h_bands"
                      ]
              })

          crossover_results.sort(
              key=lambda x: x[
                  "opportunity_score"
              ],
              reverse=True
          )

          for index, result in enumerate(
              crossover_results,
              start=1
          ):
              result["rank"] = index

          # ============================================================
          # FINAL OUTPUT
          # ============================================================

          latest_output = {
              "version": "3.0",
              "generated_at": NOW_ISO,

              "description": (
                  "ShortPrompt Trend Radar - "
                  "Italy + Global markets"
              ),

              "traffic_note": (
                  "Google Trends RSS traffic "
                  "is represented as bands. "
                  "Band changes are not Google "
                  "percentage growth."
              ),

              "markets": {
                  market: {
                      "name": config["name"],
                      "geo": config["geo"],
                      "trend_count": len(
                          current_by_market.get(
                              market,
                              []
                          )
                      )
                  }
                  for market, config
                  in MARKETS.items()
              },

              "italy": market_results.get(
                  "IT",
                  []
              ),

              "global": global_results,

              "crossover": crossover_results,

              "top_opportunities":
                  crossover_results[:20],

              "errors": errors
          }

          # ============================================================
          # WRITE LATEST
          # ============================================================

          latest_file = DATA_DIR / "latest.json"

          latest_file.write_text(
              json.dumps(
                  latest_output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ============================================================
          # UPDATE STATE
          # ============================================================

          new_state = {}

          state_cutoff = NOW - timedelta(
              days=STATE_DAYS
          )

          for market, trends in current_by_market.items():

              for trend in trends:

                  key = (
                      market
                      + ":"
                      + trend["id"]
                  )

                  old = state.get(
                      key,
                      {}
                  )

                  first_seen = old.get(
                      "first_seen"
                  )

                  if not first_seen:
                      first_seen = NOW_ISO

                  new_state[key] = {
                      "id": trend["id"],
                      "title": trend["title"],
                      "market": market,
                      "first_seen": first_seen,
                      "last_seen": NOW_ISO,
                      "last_level":
                          trend[
                              "traffic"
                          ]["level"],
                      "last_traffic":
                          trend[
                              "traffic"
                          ]["raw"]
                  }

          # Manteniamo anche vecchi trend recenti
          for key, old in state.items():

              try:
                  last_seen = datetime.fromisoformat(
                      old.get(
                          "last_seen",
                          NOW_ISO
                      )
                  )

                  if last_seen >= state_cutoff:

                      if key not in new_state:
                          new_state[key] = old

              except Exception:
                  continue

          state_file.write_text(
              json.dumps(
                  new_state,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ============================================================
          # REMOVE HISTORY FILES OLDER THAN 72H
          # ============================================================

          for file in HISTORY_DIR.glob(
              "*.json"
          ):

              try:

                  file_date = datetime.strptime(
                      file.stem,
                      "%Y-%m-%d"
                  ).replace(
                      tzinfo=timezone.utc
                  )

                  if file_date < (
                      NOW - timedelta(
                          hours=HISTORY_HOURS + 24
                      )
                  ):
                      file.unlink()

              except Exception:
                  pass

          # ============================================================
          # SUMMARY
          # ============================================================

          print("")
          print("====================================")
          print(" SHORTPROMPT TREND RADAR V3")
          print("====================================")
          print(
              "Generated:",
              NOW_ISO
          )
          print(
              "Markets:",
              ", ".join(MARKETS.keys())
          )
          print(
              "Italy:",
              len(
                  market_results.get(
                      "IT",
                      []
                  )
              )
          )
          print(
              "Global:",
              len(global_results)
          )
          print(
              "Crossovers:",
              len(crossover_results)
          )

          print("")
          print("TOP ITALY")

          for trend in market_results.get(
              "IT",
              []
          )[:10]:

              print(
                  f"{trend['score']:>3} "
                  f"{trend['status']:<12} "
                  f"{trend['traffic']['raw']:<8} "
                  f"{trend['title']}"
              )

          print("")
          print("TOP GLOBAL")

          for trend in global_results[:10]:

              print(
                  f"{trend['score']:>3} "
                  f"{trend['status']:<12} "
                  f"L{trend['traffic_level']} "
                  f"{trend['title']}"
              )

          print("")
          print("TOP CROSSOVER")

          for trend in crossover_results[:10]:

              print(
                  f"{trend['opportunity_score']:>3} "
                  f"{trend['crossover_status']:<8} "
                  f"{trend['title']}"
              )

          print("")
          print("Done.")

      - name: Commit trend data
        shell: bash
        run: |
          git config user.name "ShortPrompt Trend Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update Trend Radar data"
          git push
