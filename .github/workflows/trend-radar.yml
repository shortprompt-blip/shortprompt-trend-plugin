name: ShortPrompt Trend Radar

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-trends:
    name: Collect and Analyze Google Trends
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ================================================================
      # NODE 24
      # ================================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify environment
        run: |
          node --version
          npm --version
          python3 --version

      # ================================================================
      # COLLECT + ANALYZE
      # ================================================================

      - name: Collect and analyze Google Trends
        env:
          TZ: Europe/Rome
        run: |
          python3 <<'PY'

          import json
          import math
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          from datetime import datetime, timedelta, timezone
          from pathlib import Path


          # ============================================================
          # CONFIGURATION
          # ============================================================

          FEED_URL = "https://trends.google.com/trending/rss?geo=IT"

          DATA_DIR = Path("data")
          HISTORY_DIR = DATA_DIR / "history"

          LATEST_FILE = DATA_DIR / "latest.json"
          STATE_FILE = DATA_DIR / "trends-state.json"

          HISTORY_DAYS = 30
          LOOKBACK_HOURS = 24
          STATE_RETENTION_DAYS = 7

          DATA_DIR.mkdir(parents=True, exist_ok=True)
          HISTORY_DIR.mkdir(parents=True, exist_ok=True)


          # ============================================================
          # CURRENT TIME
          # ============================================================

          now = datetime.now(timezone.utc).astimezone()
          now_iso = now.isoformat()

          print("========================================")
          print("SHORTPROMPT TREND RADAR")
          print("========================================")
          print(f"Timestamp: {now_iso}")
          print("")


          # ============================================================
          # NAMESPACE
          # ============================================================

          HT_NS = "https://trends.google.com/trending/rss"


          # ============================================================
          # TEXT HELPERS
          # ============================================================

          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()


          def normalize_title(value):
              value = clean_text(value).lower()
              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # ============================================================
          # TRAFFIC PARSER
          # ============================================================

          def parse_traffic(value):

              if not value:
                  return 0

              value = (
                  str(value)
                  .strip()
                  .upper()
                  .replace(",", "")
              )

              match = re.match(
                  r"([0-9.]+)\s*([KMB]?)",
                  value
              )

              if not match:
                  return 0

              number = float(
                  match.group(1)
              )

              suffix = match.group(2)

              multipliers = {
                  "": 1,
                  "K": 1000,
                  "M": 1000000,
                  "B": 1000000000
              }

              return int(
                  number *
                  multipliers.get(
                      suffix,
                      1
                  )
              )


          # ============================================================
          # CATEGORY KEYWORDS
          # ============================================================

          CATEGORY_KEYWORDS = {

              "AI": [
                  "ai",
                  "intelligenza artificiale",
                  "chatgpt",
                  "gemini",
                  "claude",
                  "openai",
                  "anthropic",
                  "deepmind",
                  "copilot",
                  "llm",
                  "machine learning",
                  "robot"
              ],

              "Tech": [
                  "apple",
                  "iphone",
                  "ipad",
                  "android",
                  "samsung",
                  "google",
                  "microsoft",
                  "windows",
                  "linux",
                  "meta",
                  "tesla",
                  "nvidia",
                  "intel",
                  "amd",
                  "sony",
                  "playstation",
                  "xbox",
                  "whatsapp",
                  "instagram",
                  "facebook",
                  "tiktok",
                  "youtube",
                  "netflix",
                  "spotify"
              ],

              "Sport": [
                  "calcio",
                  "serie a",
                  "serie b",
                  "serie c",
                  "champions",
                  "europa league",
                  "conference league",
                  "mondiali",
                  "formula 1",
                  "f1",
                  "motogp",
                  "tennis",
                  "basket",
                  "nba",
                  "atp",
                  "wta",
                  "olimpiadi",
                  "giro d'italia",
                  "tour de france"
              ],

              "Entertainment": [
                  "film",
                  "cinema",
                  "serie tv",
                  "serie",
                  "netflix",
                  "prime video",
                  "disney",
                  "attore",
                  "attrice",
                  "cantante",
                  "concerto",
                  "musica",
                  "festival",
                  "reality",
                  "grande fratello",
                  "sanremo"
              ],

              "Business": [
                  "borsa",
                  "azioni",
                  "bitcoin",
                  "ethereum",
                  "crypto",
                  "criptovalute",
                  "economia",
                  "inflazione",
                  "bce",
                  "fed",
                  "banche",
                  "tim",
                  "enel",
                  "eni",
                  "stellantis"
              ]
          }


          def classify_category(
              title,
              news_titles
          ):

              text = " ".join(
                  [title] +
                  [
                      item
                      for item in news_titles
                      if item
                  ]
              ).lower()

              scores = {}

              for category, keywords in CATEGORY_KEYWORDS.items():

                  score = 0

                  for keyword in keywords:

                      if keyword in text:
                          score += 1

                  scores[category] = score

              best_category = max(
                  scores,
                  key=scores.get
              )

              if scores[best_category] == 0:
                  return "News"

              return best_category


          # ============================================================
          # FETCH GOOGLE TRENDS RSS
          # ============================================================

          print("Fetching Google Trends RSS...")

          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; "
                      "ShortPrompt-Trend-Radar/1.0)"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  xml_data = response.read()

          except Exception as error:

              print(
                  f"ERROR fetching Google Trends: {error}"
              )

              raise


          print(
              f"RSS downloaded: "
              f"{len(xml_data)} bytes"
          )


          # ============================================================
          # PARSE XML
          # ============================================================

          try:

              root = ET.fromstring(
                  xml_data
              )

          except Exception as error:

              print(
                  f"ERROR parsing XML: {error}"
              )

              raise


          channel = root.find("channel")

          if channel is None:

              raise RuntimeError(
                  "Google Trends RSS channel not found."
              )


          # ============================================================
          # PARSE TRENDS
          # ============================================================

          trends = []

          for item in channel.findall("item"):

              title = clean_text(
                  item.findtext("title")
              )

              if not title:
                  continue

              key = normalize_title(
                  title
              )

              description = clean_text(
                  item.findtext("description")
              )

              pub_date = clean_text(
                  item.findtext("pubDate")
              )

              traffic = clean_text(
                  item.findtext(
                      f"{{{HT_NS}}}approx_traffic"
                  )
              )

              traffic_value = parse_traffic(
                  traffic
              )

              picture = clean_text(
                  item.findtext(
                      f"{{{HT_NS}}}picture"
                  )
              )

              picture_source = clean_text(
                  item.findtext(
                      f"{{{HT_NS}}}picture_source"
                  )
              )

              news_items = []

              for news in item.findall(
                  f"{{{HT_NS}}}news_item"
              ):

                  news_title = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}"
                          f"news_item_title"
                      )
                  )

                  news_snippet = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}"
                          f"news_item_snippet"
                      )
                  )

                  news_url = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}"
                          f"news_item_url"
                      )
                  )

                  news_picture = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}"
                          f"news_item_picture"
                      )
                  )

                  news_source = clean_text(
                      news.findtext(
                          f"{{{HT_NS}}}"
                          f"news_item_source"
                      )
                  )

                  news_items.append({

                      "title": news_title,

                      "snippet": news_snippet,

                      "url": news_url,

                      "picture": news_picture,

                      "source": news_source

                  })


              news_titles = [
                  item["title"]
                  for item in news_items
                  if item["title"]
              ]


              sources = sorted(
                  set(
                      item["source"]
                      for item in news_items
                      if item["source"]
                  )
              )


              category = classify_category(
                  title,
                  news_titles
              )


              trends.append({

                  "title": title,

                  "key": key,

                  "traffic": traffic,

                  "traffic_value":
                      traffic_value,

                  "description":
                      description,

                  "google_pub_date":
                      pub_date,

                  "picture":
                      picture,

                  "picture_source":
                      picture_source,

                  "news_count":
                      len(news_items),

                  "source_count":
                      len(sources),

                  "sources":
                      sources,

                  "category":
                      category,

                  "news":
                      news_items

              })


          print(
              f"Trends found: {len(trends)}"
          )


          # ============================================================
          # LOAD TREND STATE
          # ============================================================

          state = {}

          if STATE_FILE.exists():

              try:

                  with STATE_FILE.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      loaded_state = json.load(
                          file
                      )

                  if isinstance(
                      loaded_state,
                      dict
                  ):

                      state = loaded_state

              except Exception as error:

                  print(
                      "WARNING: could not load "
                      f"{STATE_FILE}: {error}"
                  )

                  state = {}


          # ============================================================
          # LOAD RECENT HISTORY
          # ============================================================

          recent_snapshots = []

          history_cutoff = (
              now -
              timedelta(
                  hours=LOOKBACK_HOURS
              )
          )


          for history_file in sorted(
              HISTORY_DIR.glob("*.json")
          ):

              try:

                  with history_file.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      history_data = json.load(
                          file
                      )

              except Exception:

                  continue


              if not isinstance(
                  history_data,
                  list
              ):

                  continue


              for snapshot in history_data:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue

                  try:

                      timestamp = (
                          datetime.fromisoformat(
                              timestamp_raw
                          )
                      )

                  except Exception:

                      continue


                  if timestamp >= history_cutoff:

                      recent_snapshots.append(
                          snapshot
                      )


          recent_snapshots.sort(
              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )
          )


          print(
              f"Recent snapshots loaded: "
              f"{len(recent_snapshots)}"
          )


          # ============================================================
          # FIND HISTORICAL SNAPSHOT
          # ============================================================

          def find_previous(
              key,
              minutes
          ):

              target = (
                  now -
                  timedelta(
                      minutes=minutes
                  )
              )

              best = None
              best_delta = None


              for snapshot in recent_snapshots:

                  timestamp_raw = snapshot.get(
                      "timestamp"
                  )

                  if not timestamp_raw:
                      continue

                  try:

                      timestamp = (
                          datetime.fromisoformat(
                              timestamp_raw
                          )
                      )

                  except Exception:

                      continue


                  if timestamp > target:
                      continue


                  delta = (
                      target -
                      timestamp
                  )


                  if (
                      best_delta is None
                      or
                      delta < best_delta
                  ):

                      best = snapshot
                      best_delta = delta


              if best is None:
                  return None


              for historical_trend in best.get(
                  "trends",
                  []
              ):

                  if (
                      historical_trend.get(
                          "key"
                      )
                      == key
                  ):

                      return historical_trend


              return None


          # ============================================================
          # CALCULATE GROWTH
          # ============================================================

          def calculate_growth(
              current_value,
              previous
          ):

              if previous is None:
                  return None

              old_value = float(
                  previous.get(
                      "traffic_value",
                      0
                  )
              )

              new_value = float(
                  current_value
              )

              if old_value <= 0:
                  return None

              return round(
                  (
                      (
                          new_value -
                          old_value
                      )
                      /
                      old_value
                  )
                  * 100,
                  1
              )


          # ============================================================
          # SCORE COMPONENTS
          # ============================================================

          def traffic_score(
              traffic_value
          ):

              if traffic_value <= 0:
                  return 0

              score = (
                  math.log10(
                      traffic_value + 1
                  )
                  /
                  6
              ) * 40

              return min(
                  40,
                  round(
                      score,
                      1
                  )
              )


          def news_score(
              news_count
          ):

              return min(
                  15,
                  round(
                      news_count * 3,
                      1
                  )
              )


          def source_score(
              source_count
          ):

              return min(
                  10,
                  round(
                      source_count * 3.33,
                      1
                  )
              )


          def persistence_score(
              appearances
          ):

              return min(
                  10,
                  round(
                      appearances,
                      1
                  )
              )


          def growth_score(
              changes
          ):

              valid = [
                  value
                  for value in changes
                  if isinstance(
                      value,
                      (int, float)
                  )
              ]

              if not valid:
                  return 0

              positive = [
                  value
                  for value in valid
                  if value > 0
              ]

              if not positive:
                  return 0

              average = (
                  sum(positive)
                  /
                  len(positive)
              )

              return min(
                  25,
                  round(
                      math.log10(
                          average + 1
                      ) * 12,
                      1
                  )
              )


          # ============================================================
          # ANALYZE TRENDS
          # ============================================================

          enriched_trends = []


          for trend in trends:

              key = trend["key"]

              previous_state = state.get(
                  key,
                  {}
              )


              # --------------------------------------------------------
              # FIRST / LAST SEEN
              # --------------------------------------------------------

              first_seen = previous_state.get(
                  "first_seen"
              )

              if not first_seen:

                  first_seen = now_iso


              last_seen = now_iso


              # --------------------------------------------------------
              # APPEARANCES
              # --------------------------------------------------------

              appearances = int(
                  previous_state.get(
                      "appearances",
                      0
                  )
              ) + 1


              # --------------------------------------------------------
              # HISTORICAL VALUES
              # --------------------------------------------------------

              previous_30m = find_previous(
                  key,
                  30
              )

              previous_1h = find_previous(
                  key,
                  60
              )

              previous_3h = find_previous(
                  key,
                  180
              )

              previous_6h = find_previous(
                  key,
                  360
              )

              previous_24h = find_previous(
                  key,
                  1440
              )


              # --------------------------------------------------------
              # GROWTH
              # --------------------------------------------------------

              growth_30m = calculate_growth(
                  trend["traffic_value"],
                  previous_30m
              )

              growth_1h = calculate_growth(
                  trend["traffic_value"],
                  previous_1h
              )

              growth_3h = calculate_growth(
                  trend["traffic_value"],
                  previous_3h
              )

              growth_6h = calculate_growth(
                  trend["traffic_value"],
                  previous_6h
              )

              growth_24h = calculate_growth(
                  trend["traffic_value"],
                  previous_24h
              )


              changes = [

                  growth_30m,

                  growth_1h,

                  growth_3h,

                  growth_6h,

                  growth_24h

              ]


              # --------------------------------------------------------
              # DURATION
              # --------------------------------------------------------

              try:

                  first_seen_dt = (
                      datetime.fromisoformat(
                          first_seen
                      )
                  )

                  duration_seconds = max(
                      0,
                      int(
                          (
                              now -
                              first_seen_dt
                          ).total_seconds()
                      )
                  )

              except Exception:

                  duration_seconds = 0


              duration_minutes = (
                  duration_seconds //
                  60
              )


              # --------------------------------------------------------
              # SCORE
              # --------------------------------------------------------

              score = (

                  traffic_score(
                      trend["traffic_value"]
                  )

                  +

                  growth_score(
                      changes
                  )

                  +

                  news_score(
                      trend["news_count"]
                  )

                  +

                  source_score(
                      trend["source_count"]
                  )

                  +

                  persistence_score(
                      appearances
                  )

              )


              score = min(
                  100,
                  round(
                      score,
                      1
                  )
              )


              # --------------------------------------------------------
              # STATUS
              # --------------------------------------------------------

              if (
                  growth_30m is not None
                  and
                  growth_1h is not None
                  and
                  growth_30m >= 50
                  and
                  growth_1h >= 25
              ):

                  status = "ACCELERATING"


              elif (
                  growth_1h is not None
                  and
                  growth_1h >= 20
              ):

                  status = "RISING"


              elif (
                  appearances <= 2
                  and
                  (
                      trend["traffic_value"]
                      >= 100
                      or
                      trend["news_count"]
                      >= 2
                  )
              ):

                  status = "EMERGING"


              elif (
                  growth_6h is not None
                  and
                  growth_6h <= -25
              ):

                  status = "COOLING"


              elif (
                  growth_24h is not None
                  and
                  abs(growth_24h) < 20
              ):

                  status = "STABLE"


              else:

                  status = "HOT"


              # --------------------------------------------------------
              # UPDATE STATE
              # --------------------------------------------------------

              state[key] = {

                  "title":
                      trend["title"],

                  "first_seen":
                      first_seen,

                  "last_seen":
                      last_seen,

                  "appearances":
                      appearances,

                  "last_traffic":
                      trend["traffic"],

                  "last_traffic_value":
                      trend["traffic_value"],

                  "category":
                      trend["category"],

                  "status":
                      status,

                  "score":
                      score

              }


              # --------------------------------------------------------
              # ENRICHED TREND
              # --------------------------------------------------------

              enriched_trends.append({

                  "title":
                      trend["title"],

                  "key":
                      key,

                  "category":
                      trend["category"],

                  "status":
                      status,

                  "score":
                      score,

                  "traffic":
                      trend["traffic"],

                  "traffic_value":
                      trend["traffic_value"],

                  "first_seen":
                      first_seen,

                  "last_seen":
                      last_seen,

                  "appearances":
                      appearances,

                  "duration_minutes":
                      duration_minutes,

                  "growth_30m":
                      growth_30m,

                  "growth_1h":
                      growth_1h,

                  "growth_3h":
                      growth_3h,

                  "growth_6h":
                      growth_6h,

                  "growth_24h":
                      growth_24h,

                  "news_count":
                      trend["news_count"],

                  "source_count":
                      trend["source_count"],

                  "sources":
                      trend["sources"],

                  "picture":
                      trend["picture"],

                  "picture_source":
                      trend["picture_source"],

                  "news":
                      trend["news"]

              })


          # ============================================================
          # SORT BY SCORE
          # ============================================================

          enriched_trends.sort(

              key=lambda item: (

                  -float(
                      item.get(
                          "score",
                          0
                      )
                  ),

                  -float(
                      item.get(
                          "traffic_value",
                          0
                      )
                  )

              )

          )


          for index, trend in enumerate(
              enriched_trends,
              start=1
          ):

              trend["rank"] = index


          # ============================================================
          # LATEST.JSON
          # ============================================================

          latest = {

              "timestamp":
                  now_iso,

              "source":
                  "Google Trends RSS",

              "geo":
                  "IT",

              "feed_url":
                  FEED_URL,

              "trend_count":
                  len(enriched_trends),

              "trends":
                  enriched_trends

          }


          with LATEST_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  latest,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # COMPACT HISTORY SNAPSHOT
          # ============================================================

          compact_snapshot = {

              "timestamp":
                  now_iso,

              "trends": [

                  {

                      "key":
                          trend["key"],

                      "title":
                          trend["title"],

                      "traffic":
                          trend["traffic"],

                      "traffic_value":
                          trend["traffic_value"]

                  }

                  for trend in trends

              ]

          }


          # ============================================================
          # DAILY HISTORY FILE
          # ============================================================

          history_file = (

              HISTORY_DIR
              /
              f"{now.strftime('%Y-%m-%d')}.json"

          )


          day_history = []


          if history_file.exists():

              try:

                  with history_file.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      loaded_history = json.load(
                          file
                      )

                  if isinstance(
                      loaded_history,
                      list
                  ):

                      day_history = loaded_history

              except Exception as error:

                  print(
                      "WARNING: could not load "
                      f"{history_file}: {error}"
                  )

                  day_history = []


          day_history.append(
              compact_snapshot
          )


          # Keep snapshots from the last 24 hours.
          day_cutoff = (
              now -
              timedelta(
                  hours=LOOKBACK_HOURS
              )
          )


          cleaned_history = []


          for snapshot in day_history:

              timestamp_raw = snapshot.get(
                  "timestamp"
              )

              if not timestamp_raw:
                  continue

              try:

                  snapshot_time = (
                      datetime.fromisoformat(
                          timestamp_raw
                      )
                  )

              except Exception:

                  continue


              if snapshot_time >= day_cutoff:

                  cleaned_history.append(
                      snapshot
                  )


          cleaned_history.sort(
              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )
          )


          with history_file.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  cleaned_history,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # REMOVE OLD HISTORY FILES
          # ============================================================

          history_date_cutoff = (

              now.date()
              -
              timedelta(
                  days=HISTORY_DAYS
              )

          )


          for old_file in HISTORY_DIR.glob(
              "*.json"
          ):

              try:

                  file_date = datetime.strptime(
                      old_file.stem,
                      "%Y-%m-%d"
                  ).date()

              except Exception:

                  continue


              if file_date < history_date_cutoff:

                  print(
                      f"Deleting old history: "
                      f"{old_file}"
                  )

                  old_file.unlink()


          # ============================================================
          # REMOVE STALE STATE
          # ============================================================

          state_cutoff = (
              now -
              timedelta(
                  days=STATE_RETENTION_DAYS
              )
          )


          stale_keys = []


          for key, item in state.items():

              last_seen_raw = item.get(
                  "last_seen"
              )

              if not last_seen_raw:

                  stale_keys.append(
                      key
                  )

                  continue


              try:

                  last_seen = (
                      datetime.fromisoformat(
                          last_seen_raw
                      )
                  )

              except Exception:

                  stale_keys.append(
                      key
                  )

                  continue


              if last_seen < state_cutoff:

                  stale_keys.append(
                      key
                  )


          for key in stale_keys:

              del state[key]


          # ============================================================
          # SAVE STATE
          # ============================================================

          with STATE_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  state,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # OUTPUT SUMMARY
          # ============================================================

          print("")
          print("========================================")
          print("TREND RADAR RESULT")
          print("========================================")

          for trend in enriched_trends:

              print(

                  f"{trend['rank']:02d}. "

                  f"{trend['title']} | "

                  f"{trend['status']} | "

                  f"{trend['score']}/100 | "

                  f"{trend['traffic']}"

              )


          print("")
          print("Generated files:")

          print(
              f"- {LATEST_FILE}"
          )

          print(
              f"- {STATE_FILE}"
          )

          print(
              f"- {history_file}"
          )

          print("")


          PY

      # ================================================================
      # VALIDATE JSON
      # ================================================================

      - name: Validate generated JSON
        run: |
          python3 <<'PY'

          import json
          from pathlib import Path

          required_files = [

              Path("data/latest.json"),

              Path("data/trends-state.json")

          ]


          for file in required_files:

              if not file.exists():

                  raise SystemExit(
                      f"Missing file: {file}"
                  )


              with file.open(
                  "r",
                  encoding="utf-8"
              ) as handle:

                  json.load(handle)


              print(
                  f"Valid JSON: {file}"
              )


          history_files = list(
              Path("data/history").glob(
                  "*.json"
              )
          )


          print(
              f"History files: "
              f"{len(history_files)}"
          )


          for file in history_files:

              with file.open(
                  "r",
                  encoding="utf-8"
              ) as handle:

                  json.load(handle)


              print(
                  f"Valid JSON: {file}"
              )

          print("")
          print(
              "All Trend Radar JSON files "
              "are valid."
          )

          PY

